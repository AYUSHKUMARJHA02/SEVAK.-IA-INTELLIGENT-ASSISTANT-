<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00d4ff">
<title>SEVAK — Your Intelligent Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#00d4ff;--secondary:#7c3aed;--accent:#ff6b9d;--bg:#0a0a1a;
  --surface:rgba(255,255,255,.05);--surface-hover:rgba(255,255,255,.09);
  --text:#ffffff;--text-secondary:#c6c9e6;--glass-border:rgba(255,255,255,.12);
  --orb-glow:rgba(0,212,255,.6);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
  --gold:#ffd77a;
  --font-display:'Orbitron',monospace;--font-body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;height:100vh;width:100vw}
body{background:var(--bg);font-family:var(--font-body);color:var(--text);user-select:none;-webkit-user-select:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.main-container{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100vh;width:100vw;padding:20px 20px 14px;gap:10px;overflow:hidden}
.header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 30px;background:rgba(10,10,26,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);z-index:10;gap:8px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:900;font-size:1.5rem;letter-spacing:3px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-icon{font-size:1.8rem;-webkit-text-fill-color:initial;animation:logoPulse 2s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.status-badge{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:#d3d6ef;padding:8px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--glass-border);letter-spacing:1px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:dotPulse 1.5s ease-in-out infinite}
.status-dot.idle{background:var(--primary);animation:dotPulse 2.5s ease-in-out infinite}
.status-dot.listening{background:var(--accent);animation:dotPulse .5s ease-in-out infinite}
.status-dot.speaking{background:var(--secondary);animation:dotPulse .8s ease-in-out infinite}
.status-dot.processing{background:var(--warning);animation:dotPulse .7s ease-in-out infinite}
.status-dot.error{background:var(--danger);animation:dotPulse 1s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.orb-area{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:70px}
.orb-container{position:relative;width:120px;height:120px;cursor:pointer;transition:transform .3s;outline:none}
.orb-container:hover{transform:scale(1.05)}
.orb-container:active{transform:scale(.95)}
.orb-container:focus-visible{box-shadow:0 0 0 3px rgba(0,212,255,.6);border-radius:50%}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(0,212,255,.8),rgba(124,58,237,.6),rgba(255,107,157,.4));box-shadow:0 0 60px var(--orb-glow),0 0 120px rgba(124,58,237,.3),0 0 200px rgba(255,107,157,.15),inset 0 0 40px rgba(255,255,255,.1);animation:orbFloat 4s ease-in-out infinite,orbColorShift 8s ease-in-out infinite;transition:all .5s;display:flex;align-items:center;justify-content:center;font-size:3rem}
.orb.listening{box-shadow:0 0 100px rgba(255,107,157,.8),0 0 200px rgba(255,107,157,.4),0 0 300px rgba(255,107,157,.2),inset 0 0 60px rgba(255,255,255,.15);animation:orbFloat 4s ease-in-out infinite,orbListening .8s ease-in-out infinite}
.orb.speaking{box-shadow:0 0 100px rgba(124,58,237,.8),0 0 200px rgba(124,58,237,.4),0 0 300px rgba(124,58,237,.2),inset 0 0 60px rgba(255,255,255,.15);animation:orbFloat 4s ease-in-out infinite,orbSpeaking .4s ease-in-out infinite}
.orb-ring{position:absolute;border-radius:50%;border:2px solid rgba(0,212,255,.3);animation:ringExpand 3s ease-out infinite;pointer-events:none}
.orb-ring:nth-child(2){animation-delay:1s;border-color:rgba(124,58,237,.3)}
.orb-ring:nth-child(3){animation-delay:2s;border-color:rgba(255,107,157,.2)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes orbColorShift{0%,100%{filter:hue-rotate(0deg)}33%{filter:hue-rotate(20deg)}66%{filter:hue-rotate(-15deg)}}
@keyframes orbListening{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes orbSpeaking{0%,100%{transform:scale(1);border-radius:50%}25%{transform:scale(1.06,.94);border-radius:45%}50%{transform:scale(.96,1.06);border-radius:55%}75%{transform:scale(1.04,.96);border-radius:48%}}
@keyframes ringExpand{0%{width:100%;height:100%;opacity:.8}100%{width:250%;height:250%;opacity:0}}
.orb-emoji{font-size:2.4rem;animation:emojiFloat 3s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(255,255,255,.5))}
@keyframes emojiFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(5deg)}}
.orb-label{font-family:var(--font-display);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#d3d6ef;text-align:center}
#waveformCanvas{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:100%;height:30px;pointer-events:none;opacity:0;transition:opacity .4s}
#waveformCanvas.active{opacity:1}
/* ── 🚩 Jai Shree Ram single button (replaces old chips row) ── */
.jai-ram-area{display:flex;justify-content:center;align-items:center;padding:2px 8px;animation:chipFade .5s ease-out}
.jai-ram-btn{background:linear-gradient(135deg,rgba(255,140,0,.28),rgba(255,180,0,.18));border:1px solid rgba(255,183,77,.7);color:#ffe9a8;padding:10px 26px;border-radius:24px;font-family:var(--font-display);font-size:.9rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .3s;text-shadow:0 0 14px rgba(255,183,77,.7),0 0 4px rgba(255,255,255,.5);box-shadow:0 0 22px rgba(255,160,0,.3),inset 0 0 18px rgba(255,183,77,.15);animation:jaiGlow 3s ease-in-out infinite}
.jai-ram-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 6px 32px rgba(255,160,0,.55),0 0 60px rgba(255,140,0,.35);border-color:#ffd77a;background:linear-gradient(135deg,rgba(255,160,20,.42),rgba(255,200,30,.28))}
.jai-ram-btn:active{transform:scale(.96)}
@keyframes jaiGlow{0%,100%{box-shadow:0 0 22px rgba(255,160,0,.3),inset 0 0 18px rgba(255,183,77,.15)}50%{box-shadow:0 0 38px rgba(255,160,0,.55),inset 0 0 26px rgba(255,183,77,.25)}}
@keyframes chipFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chat-panel{width:100%;max-width:750px;flex:1 1 auto;min-height:220px;background:var(--surface);border:1px solid var(--glass-border);border-radius:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden;transition:all .4s;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--glass-border);font-size:.8rem;letter-spacing:1px;color:#d3d6ef;font-weight:600;text-transform:uppercase}
.chat-clear{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.2rem;transition:color .3s;padding:4px}
.chat-clear:hover{color:var(--accent)}
.chat-messages{flex:1;overflow-y:auto;padding:20px 25px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.3) transparent}
.chat-messages::-webkit-scrollbar{width:5px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.message{max-width:85%;padding:12px 18px;border-radius:16px;font-size:.92rem;line-height:1.65;letter-spacing:.2px;animation:messageIn .4s ease-out forwards;word-wrap:break-word;position:relative}
.message.user{align-self:flex-end;background:linear-gradient(135deg,rgba(0,212,255,.34),rgba(0,212,255,.14));border:1px solid rgba(0,212,255,.55);border-bottom-right-radius:4px;color:#f2feff;box-shadow:0 0 24px rgba(0,212,255,.25);text-shadow:0 0 10px rgba(180,240,255,.25)}
.message.sevak{align-self:flex-start;background:linear-gradient(135deg,rgba(124,58,237,.32),rgba(0,212,255,.12));border:1px solid rgba(160,135,255,.55);border-bottom-left-radius:4px;color:#fdfbff;box-shadow:0 0 26px rgba(124,58,237,.28),inset 0 0 24px rgba(0,212,255,.08);text-shadow:0 0 16px rgba(200,185,255,.35),0 0 2px rgba(255,255,255,.3)}
.message .timestamp{font-size:.65rem;color:var(--text-secondary);margin-top:4px;display:block;opacity:.8}
.msg-copy{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.4);border:1px solid var(--glass-border);color:var(--text-secondary);border-radius:8px;font-size:.7rem;padding:4px 6px;cursor:pointer;opacity:0;transition:opacity .2s;font-family:var(--font-body)}
.message:hover .msg-copy{opacity:.85}
.msg-copy:hover{color:var(--primary);border-color:var(--primary)}
.message-image{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.15);cursor:pointer;transition:all .3s;display:flex;justify-content:center;align-items:center;max-width:100%;box-shadow:0 5px 25px rgba(0,0,0,.3);background:rgba(0,0,0,.35);padding:4px}
.message-image:hover{border-color:var(--primary);box-shadow:0 5px 35px rgba(0,212,255,.3);transform:scale(1.01)}
.message-image img{max-width:100%;max-height:280px;width:auto;height:auto;display:block;object-fit:contain;border-radius:8px}
.image-caption{font-size:.7rem;color:var(--text-secondary);padding:6px 10px;background:rgba(0,0,0,.4);text-align:center;font-style:italic}
.code-block{background:rgba(0,0,0,.4);padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:.82rem;color:#9df7ff;white-space:pre-wrap;font-family:'Courier New',ui-monospace,monospace;margin:10px 0;line-height:1.55;user-select:text;-webkit-user-select:text;border:1px solid rgba(0,212,255,.2)}
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.lightbox-overlay.active{opacity:1;pointer-events:auto}
.lightbox-content{max-width:90%;max-height:85%;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 0 80px rgba(0,212,255,.4)}
.lightbox-content img{width:100%;height:auto;display:block;object-fit:contain;max-height:80vh}
.lightbox-close{position:absolute;top:12px;right:18px;font-size:2.2rem;color:#fff;cursor:pointer;z-index:1001;transition:all .3s;text-shadow:0 0 20px rgba(0,0,0,.5);line-height:1}
.lightbox-close:hover{color:var(--accent);transform:scale(1.15)}
.lightbox-caption{text-align:center;color:var(--text-secondary);font-size:.85rem;padding:10px 20px}
@keyframes messageIn{0%{opacity:0;transform:translateY(15px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.typing-indicator{display:flex;gap:4px;padding:12px 16px;align-self:flex-start;background:rgba(124,58,237,.15);border-radius:16px;border-bottom-left-radius:4px;animation:messageIn .3s ease-out}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text-secondary);animation:typingBounce 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}
.input-area{display:flex;align-items:center;gap:12px;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));width:100%;max-width:750px;background:var(--surface);border-radius:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:0 20px 60px rgba(0,0,0,.4);flex-shrink:0}
.input-area input{flex:1;background:transparent;border:none;outline:none;color:#ffffff;font-size:.98rem;font-family:var(--font-body);letter-spacing:.3px;padding:8px 4px;min-width:0}
.input-area input::placeholder{color:var(--text-secondary);opacity:.7}
.input-area:focus-within{border-color:rgba(0,212,255,.55);box-shadow:0 0 38px rgba(0,212,255,.22),0 20px 60px rgba(0,0,0,.4)}
.mic-btn,.send-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
.mic-btn{border:2px solid var(--glass-border);background:var(--surface);color:var(--text)}
.mic-btn:hover{border-color:var(--primary);background:rgba(0,212,255,.15);box-shadow:0 0 25px rgba(0,212,255,.3)}
.mic-btn.listening{border-color:var(--accent);background:rgba(255,107,157,.2);box-shadow:0 0 35px rgba(255,107,157,.5);animation:micPulse .6s ease-in-out infinite}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.send-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 20px rgba(0,212,255,.4)}
.send-btn:hover{transform:scale(1.08);box-shadow:0 6px 30px rgba(0,212,255,.6)}
.send-btn:active{transform:scale(.95)}
.glitch-text{position:relative;animation:glitchSkew 6s infinite}
@keyframes glitchSkew{0%,90%,100%{transform:skew(0)}92%{transform:skew(2deg)}94%{transform:skew(-1deg)}96%{transform:skew(1deg)}98%{transform:skew(0)}}
.mode-toggle{display:flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:.72rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#d3d6ef;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--glass-border);cursor:pointer;transition:all .3s;white-space:nowrap}
.mode-toggle:hover{color:#fff;border-color:var(--primary);box-shadow:0 0 20px rgba(0,212,255,.25)}
.mode-toggle.active{color:#06131a;background:linear-gradient(135deg,var(--primary),var(--secondary));border-color:transparent;box-shadow:0 0 25px rgba(0,212,255,.4)}
.fullpage-overlay{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,rgba(124,58,237,.32),transparent 65%),radial-gradient(900px 500px at 85% 110%,rgba(0,212,255,.22),transparent 60%),radial-gradient(700px 400px at 5% 90%,rgba(255,107,157,.14),transparent 60%),rgba(9,9,28,.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);opacity:0;pointer-events:none;transform:translateY(24px) scale(.985);transition:opacity .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.fullpage-overlay.active{opacity:1;pointer-events:auto;transform:none}
.fullpage-header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--glass-border);background:rgba(10,10,26,.5);flex-shrink:0;z-index:2}
.fullpage-brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:900;font-size:1.05rem;letter-spacing:3px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fullpage-brand .fp-icon{font-size:1.35rem;-webkit-text-fill-color:initial}
.fullpage-actions{display:flex;align-items:center;gap:10px}
.fp-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--glass-border);color:var(--text);font-size:1rem;cursor:pointer;transition:all .3s}
.fp-btn:hover{border-color:var(--primary);background:rgba(0,212,255,.12);box-shadow:0 0 22px rgba(0,212,255,.3);transform:translateY(-1px)}
.fp-btn.speaking{border-color:var(--secondary);background:rgba(124,58,237,.2);box-shadow:0 0 25px rgba(124,58,237,.5);animation:micPulse .8s ease-in-out infinite}
.fullpage-scroll{flex:1;overflow-y:auto;padding:44px 24px 90px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.3) transparent}
.fullpage-scroll::-webkit-scrollbar{width:6px}
.fullpage-scroll::-webkit-scrollbar-track{background:transparent}
.fullpage-scroll::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.fullpage-inner{max-width:860px;margin:0 auto;animation:fpIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes fpIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.fullpage-question{display:inline-block;font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;color:#8beeff;padding:8px 16px;border-radius:20px;background:rgba(0,212,255,.16);border:1px solid rgba(0,212,255,.5);margin-bottom:24px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 0 26px rgba(0,212,255,.28)}
.fullpage-answer{font-size:1.06rem;line-height:1.95;color:#ffffff;letter-spacing:.2px;word-wrap:break-word;user-select:text;-webkit-user-select:text;text-shadow:0 0 22px rgba(150,200,255,.22)}
.fullpage-answer>*{animation:revealChild .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes revealChild{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fullpage-answer strong{color:#ffffff;font-weight:700;text-shadow:0 0 18px rgba(0,212,255,.55),0 0 40px rgba(124,58,237,.35)}
.fullpage-answer em{color:#d0d4f0}
.fullpage-answer a{color:#7fe9ff;text-decoration:none;border-bottom:1px dashed rgba(0,212,255,.55);transition:all .25s;text-shadow:0 0 14px rgba(0,212,255,.45)}
.fullpage-answer a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.fullpage-image{margin:28px 0 10px;border-radius:20px;overflow:hidden;border:1px solid var(--glass-border);box-shadow:0 25px 70px rgba(0,0,0,.55),0 0 60px rgba(0,212,255,.15);cursor:zoom-in;transition:all .35s;background:rgba(0,0,0,.35);display:flex;justify-content:center;align-items:center;padding:6px}
.fullpage-image:hover{transform:translateY(-3px);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 80px rgba(0,212,255,.3);border-color:var(--primary)}
.fullpage-image img{max-width:100%;max-height:500px;width:auto;height:auto;object-fit:contain;display:block;border-radius:14px}
.fp-loading{display:flex;gap:8px;padding:14px 0}
.fp-loading .typing-dot{width:10px;height:10px;background:var(--primary)}
.settings-panel{position:fixed;top:0;right:0;width:320px;max-width:90vw;height:100vh;background:rgba(10,10,26,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--glass-border);z-index:950;padding:28px 24px;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.settings-panel.active{transform:translateX(0)}
.settings-title{font-family:var(--font-display);font-size:1rem;letter-spacing:2px;color:var(--primary);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.settings-close{background:none;border:none;color:var(--text-secondary);font-size:1.4rem;cursor:pointer;padding:0 4px}
.settings-close:hover{color:var(--accent)}
.settings-group label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);margin-bottom:8px;font-weight:600}
.settings-group select,.settings-group input[type=range]{width:100%;background:var(--surface);border:1px solid var(--glass-border);color:var(--text);border-radius:10px;padding:10px 12px;font-family:var(--font-body);font-size:.85rem;outline:none;cursor:pointer}
.settings-group input[type=range]{padding:6px;accent-color:var(--primary)}
.settings-value{font-size:.75rem;color:var(--primary);float:right;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,10,26,.95);border:1px solid var(--primary);color:var(--text);padding:12px 22px;border-radius:24px;font-size:.85rem;z-index:1100;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(0,212,255,.3);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.install-btn{display:none;background:linear-gradient(135deg,var(--success),#16a34a);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:.72rem;font-weight:600;cursor:pointer;letter-spacing:1px;transition:all .3s}
.install-btn.show{display:inline-flex;align-items:center;gap:6px}
.install-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(34,197,94,.5)}
@media (max-width:768px){
  .orb-container{width:90px;height:90px}.orb-emoji{font-size:1.8rem}
  .chat-panel{flex:1 1 auto;min-height:200px;max-width:95vw}.input-area{max-width:95vw;padding:10px 14px;flex-shrink:0}
  .header{padding:10px 16px}.logo{font-size:1.1rem;letter-spacing:1px}
  .message{font-size:.85rem;padding:10px 14px}.message-image img{max-height:200px}

/* ══════════════════════════════════════════════════════════════

function stripHtml(html){

function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); return true;
    }catch(_){ return false; }
  }
}

async function fetchWithTimeout(url,opts={},ms=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{return await fetch(url,Object.assign({},opts,{signal:controller.signal}));}
  finally{clearTimeout(timer);}
}

async function fetchWithRetry(url,opts={},ms=8000,retries=1){
  let lastErr=null;
  for(let i=0;i<=retries;i++){
    try{
      const resp=await fetchWithTimeout(url,opts,ms);
      if(resp.ok||(resp.status<500&&resp.status!==429)) return resp;
      if(i<retries){await new Promise(r=>setTimeout(r,1500));continue;}
      return resp;
    }catch(e){lastErr=e;if(i<retries) await new Promise(r=>setTimeout(r,1500));}
  }
  throw lastErr||new Error('fetch failed');
}

/* Response cache — 24h TTL */
const CACHE_KEY='sevak_cache_v1';
function cacheGet(key){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const c=JSON.parse(raw);
    const e=c[key];
    if(!e) return null;
    if(Date.now()>e.exp){delete c[key];localStorage.setItem(CACHE_KEY,JSON.stringify(c));return null;}
    return e.val;
  }catch(e){return null;}
}
function cacheSet(key,val,ttlMs=24*60*60*1000){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    const c=raw?JSON.parse(raw):{};
    c[key]={val,exp:Date.now()+ttlMs};
    const keys=Object.keys(c);
    if(keys.length>80){keys.sort((a,b)=>c[a].exp-c[b].exp);keys.slice(0,20).forEach(k=>delete c[k]);}
    localStorage.setItem(CACHE_KEY,JSON.stringify(c));
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   AUDIO CONTEXT (shared, fixes chime throttling)
   ══════════════════════════════════════════════════════════════ */
let sharedAudioCtx=null;
function getAudioCtx(){
  if(!sharedAudioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    sharedAudioCtx=new AC();
  }
  if(sharedAudioCtx.state==='suspended') sharedAudioCtx.resume().catch(()=>{});
  return sharedAudioCtx;
}

function playChime(){
  try{
    const ctx=getAudioCtx();
    if(!ctx) return;
    const now=ctx.currentTime;
    [880,1174.66,1567.98].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
      const t0=now+i*0.18;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(0.25,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t0+0.5);
      o.start(t0);o.stop(t0+0.55);
    });
  }catch(e){}
}

function playWaterDrop(){
  try{
    const ctx=getAudioCtx();
    if(!ctx) return;
    const now=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(420,now);
    o.frequency.exponentialRampToValueAtTime(1650,now+0.055);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(0.38,now+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.26);
    o.connect(g);g.connect(ctx.destination);
    o.start(now);o.stop(now+0.3);
    const o2=ctx.createOscillator(),g2=ctx.createGain();
    o2.type='sine';
    o2.frequency.setValueAtTime(700,now+0.07);
    o2.frequency.exponentialRampToValueAtTime(2200,now+0.12);
    g2.gain.setValueAtTime(0.0001,now+0.07);
    g2.gain.exponentialRampToValueAtTime(0.12,now+0.078);
    g2.gain.exponentialRampToValueAtTime(0.0001,now+0.24);
    o2.connect(g2);g2.connect(ctx.destination);
    o2.start(now+0.07);o2.stop(now+0.26);
    const o3=ctx.createOscillator(),g3=ctx.createGain();
    o3.type='triangle';
    o3.frequency.setValueAtTime(2800,now+0.02);
    o3.frequency.exponentialRampToValueAtTime(3600,now+0.09);
    g3.gain.setValueAtTime(0.0001,now+0.02);
    g3.gain.exponentialRampToValueAtTime(0.05,now+0.03);
    g3.gain.exponentialRampToValueAtTime(0.0001,now+0.15);
    o3.connect(g3);g3.connect(ctx.destination);
    o3.start(now+0.02);o3.stop(now+0.17);
  }catch(e){}
}

function playTempleBell(){
  try{
    const ctx=getAudioCtx();
    if(!ctx) return;
    const now=ctx.currentTime;
    const partials=[
      {f:523.25,a:0.50,d:4.2},{f:1046.50,a:0.24,d:3.2},{f:1568.0,a:0.12,d:2.4},
      {f:2093.0,a:0.08,d:1.8},{f:2637.0,a:0.05,d:1.3},{f:3520.0,a:0.03,d:1.0}
    ];
    partials.forEach((p,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=p.f;
      o.connect(g);g.connect(ctx.destination);
      const t0=now+i*0.004;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(p.a,t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+p.d);
      o.start(t0);o.stop(t0+p.d+0.05);
    });
    const len=Math.floor(ctx.sampleRate*0.05);
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const src=ctx.createBufferSource();src.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3000;bp.Q.value=1.2;
    const ng=ctx.createGain();ng.gain.value=0.09;
    src.connect(bp);bp.connect(ng);ng.connect(ctx.destination);
    src.start(now);
  }catch(e){}
}

function playFlute(){
  try{
    const ctx=getAudioCtx();
    if(!ctx) return;

    g.gain.exponentialRampToValueAtTime(0.18,now+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001,now+1.15);

    g2.gain.exponentialRampToValueAtTime(0.028,now+0.14);
    g2.gain.exponentialRampToValueAtTime(0.0001,now+1.0);

}

function playSparkle(){

/* ══════════════════════════════════════════════════════════════
   SPEECH SYNTHESIS — chunked
   ══════════════════════════════════════════════════════════════ */
function chunkText(text,maxLen=180){
  const ABBREV=/(?:^|[\s(])(?:Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|e\.g|i\.e|No|Vol|Fig|approx|Ave|Rd|Ltd|Co|Inc|Corp|Gov|Sen|Rep|Capt|Lt|Sgt|Gen|Col|Maj|Cmdr|Adm|Rev|Hon|Pres|Supt|Det|Insp|Amb)\.$/i;
  let parts=String(text||'').match(/\d+\.\d+|[^.!?।]+[.!?।]*/g)||[String(text||'')];
  const merged=[];
  for(let i=0;i<parts.length;i++){
    let p=parts[i];
    while(ABBREV.test(p.trim())&&i+1<parts.length){i++;p=p+' '+parts[i];}
    merged.push(p);
  }
  const out=[];let buf='';
  for(const p of merged){
    if((buf+p).length>maxLen&&buf){out.push(buf.trim());buf=p;}
    else buf+=p;
  }
  if(buf.trim()) out.push(buf.trim());
  return out.length?out:[''];
}

function initVoices(){
  const voices=synthesis.getVoices();
  if(!voices.length) return;
  selectedHindiVoice=
    voices.find(v=>/^hi[-_]IN$/i.test(v.lang))||
    voices.find(v=>/hi[-_]IN/i.test(v.lang))||
    voices.find(v=>/hindi/i.test(v.name))||null;
  if(prefs.voiceName){
    const match=voices.find(v=>v.name===prefs.voiceName);
    if(match){selectedVoice=match;buildVoiceSelect();return;}
  }
  const preferred=['Google UK English Female','Google US English Female','Microsoft Zira - English (United States)','Microsoft Aria - English (United States)','Samantha','Karen','Moira','Tessa','Google UK English Male','Google US English Male','Alex','Fred'];
  for(const pref of preferred){const v=voices.find(v=>v.name.includes(pref));if(v){selectedVoice=v;break;}}
  if(!selectedVoice) selectedVoice=voices.find(v=>v.lang.startsWith('en'))||voices[0];
  buildVoiceSelect();
}

function buildVoiceSelect(){
  if(!voiceSelect) return;
  const voices=synthesis.getVoices();
  voiceSelect.innerHTML='';
  if(!voices.length){
    const opt=document.createElement('option');
    opt.textContent='Loading voices…';
    voiceSelect.appendChild(opt);
    return;
  }
  voices.forEach(v=>{
    const opt=document.createElement('option');
    opt.value=v.name;
    opt.textContent=`${v.name} (${v.lang})`;
    if(selectedVoice&&v.name===selectedVoice.name) opt.selected=true;
    voiceSelect.appendChild(opt);
  });
}

function detectSpeechLang(text){
  const t=String(text||'');
  if(/[\u0900-\u097F]/.test(t)) return 'hi-IN';
  if(/\b(?:dhanyavad|dhanyawad|namaste|namaskar|kaise|kaun|kahan|kab|kyun|batao|bataiye|jankari|parichay|itihas|mausam|shubh|achha|bahut|theek|hindi)\b/i.test(t)) return 'hi-IN';
  return 'en-IN';
}

function pickVoiceFor(lang){
  try{
    const voices=synthesis.getVoices();
    if(lang==='hi-IN'){
      if(selectedHindiVoice) return selectedHindiVoice;
      const v=voices.find(x=>/^hi[-_]IN$/i.test(x.lang))||voices.find(x=>/hi[-_]IN/i.test(x.lang))||voices.find(x=>/hindi/i.test(x.name));
      if(v){selectedHindiVoice=v;return v;}
    }
  }catch(e){}
  return selectedVoice;
}

function speak(text,lang){
  if(!synthesis||!text) return;
  synthesis.cancel();
  const myToken=(speak._token=(speak._token||0)+1);
  const targetLang=lang||detectSpeechLang(text);
  const chunks=chunkText(text,180);
  const voice=pickVoiceFor(targetLang);
  isSpeaking=true;
  fullpageSpeakBtn.classList.add('speaking');
  updateUIState('speaking');
  chunks.forEach((chunk,i)=>{
    const u=new SpeechSynthesisUtterance(chunk);
    if(voice) u.voice=voice;
    u.lang=targetLang;
    u.rate=prefs.rate;
    u.pitch=prefs.pitch;
    u.volume=prefs.volume;
    if(i===chunks.length-1){
      u.onend=()=>{
        if(myToken!==speak._token) return;
        isSpeaking=false;
        fullpageSpeakBtn.classList.remove('speaking');
        updateUIState(isProcessing?'processing':'idle');
      };
      u.onerror=()=>{
        if(myToken!==speak._token) return;
        isSpeaking=false;
        fullpageSpeakBtn.classList.remove('speaking');
        updateUIState('idle');
      };
    }
    synthesis.speak(u);
  });
}

let micStream=null,analyserNode=null,micSourceNode=null;

async function ensureMicStream(){
  if(micStream&&micStream.active) return micStream;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return null;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=getAudioCtx();
    if(ctx){
      micSourceNode=ctx.createMediaStreamSource(micStream);
      analyserNode=ctx.createAnalyser();
      analyserNode.fftSize=256;
      micSourceNode.connect(analyserNode);
    }
    return micStream;
  }catch(e){return null;}
}

function stopMicStream(){
  if(micStream){
    try{micStream.getTracks().forEach(t=>t.stop());}catch(e){}
    micStream=null;
  }
  if(micSourceNode){try{micSourceNode.disconnect();}catch(e){}micSourceNode=null;}
  analyserNode=null;
}

function showWaveform(){
  waveformCanvas.classList.add('active');
  if(!waveformCtx){
    waveformCtx=waveformCanvas.getContext('2d');
    waveformCanvas.width=waveformCanvas.parentElement.offsetWidth;
    waveformCanvas.height=30;
  }
  if(waveformAnimationId) cancelAnimationFrame(waveformAnimationId);
  animateWaveform();
}
function hideWaveform(){
  waveformCanvas.classList.remove('active');
  if(waveformAnimationId){cancelAnimationFrame(waveformAnimationId);waveformAnimationId=null;}
  if(waveformCtx) waveformCtx.clearRect(0,0,waveformCanvas.width,waveformCanvas.height);
}
function animateWaveform(){
  if(!waveformCtx) return;
  const canvas=waveformCanvas,ctx=waveformCtx,w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  let dataArray=null;
  if(analyserNode){dataArray=new Uint8Array(analyserNode.frequencyBinCount);analyserNode.getByteFrequencyData(dataArray);}
  const bars=40,barWidth=w/bars,now=Date.now()/150;
  for(let i=0;i<bars;i++){
    let height;
    if(dataArray&&dataArray.length){
      const idx=Math.min(dataArray.length-1,Math.floor(i*dataArray.length/bars));
      const v=dataArray[idx]/255;
      height=v*(h-6)+4;
    }else{
      height=Math.sin(now+i*0.6)*10+Math.cos(now*1.3+i*0.8)*6+14;
    }
    const x=i*barWidth+1,y=(h-height)/2;
    const grad=ctx.createLinearGradient(0,y,0,y+height);
    grad.addColorStop(0,'#ff6b9d');grad.addColorStop(0.5,'#7c3aed');grad.addColorStop(1,'#00d4ff');
    ctx.fillStyle=grad;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,barWidth-2,height,3);
    else ctx.rect(x,y,barWidth-2,height);
    ctx.fill();
  }
  waveformAnimationId=requestAnimationFrame(animateWaveform);
}

/* ══════════════════════════════════════════════════════════════
   PARTICLES
   ══════════════════════════════════════════════════════════════ */
const particles=[];
let particleCtx=null;
function initParticles(){
  if(prefersReducedMotion){particleCanvas.style.display='none';return;}
  particleCtx=particleCanvas.getContext('2d');
  particleCanvas.width=window.innerWidth;
  particleCanvas.height=window.innerHeight;
  for(let i=0;i<100;i++){
    particles.push({
      x:Math.random()*particleCanvas.width,y:Math.random()*particleCanvas.height,
      size:Math.random()*3+1,speedX:(Math.random()-0.5)*0.4,speedY:(Math.random()-0.5)*0.4,
      opacity:Math.random()*0.6+0.2,
      color:['#00d4ff','#7c3aed','#ff6b9d','#ffffff','#ffd77a'][Math.floor(Math.random()*5)]
    });
  }
  animateParticles();
}
function animateParticles(){
  if(!particleCtx) return;
  const ctx=particleCtx;
  ctx.clearRect(0,0,particleCanvas.width,particleCanvas.height);
  particles.forEach(p=>{
    p.x+=p.speedX;p.y+=p.speedY;
    if(p.x<0)p.x=particleCanvas.width;if(p.x>particleCanvas.width)p.x=0;
    if(p.y<0)p.y=particleCanvas.height;if(p.y>particleCanvas.height)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.globalAlpha=p.opacity;ctx.fill();ctx.globalAlpha=1;
  });
  requestAnimationFrame(animateParticles);
}

/* ══════════════════════════════════════════════════════════════
   SPEECH RECOGNITION
   ══════════════════════════════════════════════════════════════ */
function initSpeechRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){console.warn('Speech recognition not supported.');return null;}
  const rec=new SR();
  rec.continuous=false;rec.interimResults=true;rec.lang=micLang;rec.maxAlternatives=1;
  rec.onstart=()=>{isListening=true;startListening._retries=0;updateUIState('listening');ensureMicStream().then(()=>showWaveform());};
  rec.onresult=event=>{
    let finalT='',interimT='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t=event.results[i][0].transcript;
      if(event.results[i].isFinal) finalT+=t;else interimT+=t;
    }
    if(interimT){textInput.value=interimT;textInput.placeholder=interimT;}
    if(finalT){textInput.value=finalT;stopListening();processCommand(finalT);}
  };
  rec.onerror=event=>{
    if(event.error==='not-allowed') addMessageText('sevak','Sir, I need microphone access to hear you. Please enable it in your browser settings. 🙏');
    else if(event.error!=='aborted') addMessageText('sevak',getRandomFrom(apologies));
    stopListening();
  };
  rec.onend=()=>{
    isListening=false;hideWaveform();stopMicStream();
    if(isProcessing) updateUIState('processing');else updateUIState('idle');
    textInput.placeholder='Type a command…';
  };
  return rec;
}
function startListening(){
  if(isSpeaking){synthesis.cancel();isSpeaking=false;}
  if(isListening){stopListening();return;}
  if(!recognition){recognition=initSpeechRecognition();if(!recognition){addMessageText('sevak','Sir, your browser doesn\'t support voice recognition. Please use Chrome or Edge. 💻');return;}}
  try{recognition.lang=micLang;}catch(e){}
  playTouchSound();
  try{recognition.start();}
  catch(e){
    stopListening();
    startListening._retries=(startListening._retries||0)+1;
    if(startListening._retries<=2) setTimeout(()=>startListening(),400);
    else{startListening._retries=0;showToast('🎤 Mic unavailable — check permissions');}
  }
}
function stopListening(){if(recognition){try{recognition.stop();}catch(e){}}isListening=false;hideWaveform();stopMicStream();}

async function fetchWikipediaSummary(topic){
  const ck='wiki:en:'+topic;
  const cached=cacheGet(ck);
  if(cached) return cached;
  try{
    const r=await fetchWithRetry(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topic)}`,{
      headers:{'User-Agent':'SevakAssistant/1.2 (educational)'}
    });
    if(!r.ok) return null;
    const d=await r.json();
    if(d.extract&&d.extract.length>0){
      const out={
        title:d.title,extract:d.extract,
        url:(d.content_urls&&d.content_urls.desktop&&d.content_urls.desktop.page)||`https://en.wikipedia.org/wiki/${encodeURIComponent(topic)}`,
        thumbnail:(d.thumbnail&&d.thumbnail.source)||null,
        originalImage:(d.originalimage&&d.originalimage.source)||null
      };
      cacheSet(ck,out);
      return out;
    }
    return null;
  }catch(e){return null;}
}
async function searchWikipedia(query){
  try{
    const r=await fetchWithRetry(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=5`);
    if(!r.ok) return null;
    const d=await r.json();
    if(d.query&&d.query.search&&d.query.search.length>0) return fetchWikipediaSummary(d.query.search[0].title);
    return null;
  }catch(e){return null;}
}
async function fetchWikimediaImage(query){
  const ck='img:wm:'+query;
  const c=cacheGet(ck);if(c)return c;
  try{
    const r=await fetchWithRetry(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*`);
    if(!r.ok) return null;
    const d=await r.json();
    if(d.query&&d.query.pages){
      for(const id of Object.keys(d.query.pages)){
        const p=d.query.pages[id];
        if(p.imageinfo&&p.imageinfo[0]&&p.imageinfo[0].thumburl){
          const out={url:p.imageinfo[0].thumburl,title:p.title.replace('File:','').replace(/\.(jpg|jpeg|png|gif|svg)$/i,'')};
          cacheSet(ck,out);return out;
        }
      }
    }
    return null;
  }catch(e){return null;}
}
async function fetchDuckDuckGoImage(query){
  const ck='img:ddg:'+query;const c=cacheGet(ck);if(c)return c;
  try{
    const r=await fetchWithRetry(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1&t=sevak`);
    if(!r.ok) return null;
    const d=await r.json();
    let out=null;
    if(d.Image&&d.Image.length) out={url:d.Image,title:d.Heading||query};
    else if(d.RelatedTopics){
      for(const t of d.RelatedTopics){
        if(t.Icon&&t.Icon.URL){out={url:t.Icon.URL,title:t.Text?t.Text.substring(0,80):query};break;}
        if(t.Topics) for(const s of t.Topics) if(s.Icon&&s.Icon.URL){out={url:s.Icon.URL,title:s.Text?s.Text.substring(0,80):query};break;}
        if(out) break;
      }
    }
    if(out) cacheSet(ck,out);
    return out;
  }catch(e){return null;}
}
async function fetchDuckDuckGoAnswer(query){
  const ck='ddg:'+query;const c=cacheGet(ck);if(c)return c;
  try{
    const r=await fetchWithRetry(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
    if(!r.ok) return null;
    const d=await r.json();
    if(d.AbstractText&&d.AbstractText.length){cacheSet(ck,d.AbstractText);return d.AbstractText;}
    if(d.Answer&&d.Answer.length){cacheSet(ck,d.Answer);return d.Answer;}
    return null;
  }catch(e){return null;}
}
async function getWeather(city){
  const ck='weather:'+city.toLowerCase();const c=cacheGet(ck);if(c)return c;
  try{
    const geo=await fetchWithRetry(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
    const gd=await geo.json();
    if(!gd.results||!gd.results.length) return null;
    const {latitude,longitude,name}=gd.results[0];
    const w=await fetchWithRetry(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
    const wd=await w.json();
    const temp=wd.current_weather.temperature;
    const windspeed=wd.current_weather.windspeed;
    const code=wd.current_weather.weathercode;
    let condition='Clear';
    if(code<=3) condition='Clear';
    else if(code<=48) condition='Foggy';
    else if(code<=67) condition='Rainy';
    else if(code<=77) condition='Snowy';
    else if(code<=82) condition='Showers';
    else if(code<=86) condition='Thunderstorm';
    else condition='Unknown';
    const out={name,temp,windspeed,condition};
    cacheSet(ck,out,30*60*1000);
    return out;
  }catch(e){return null;}
}

async function openLocalDesktopApp(appName){
  const normalized=localAppAliases[appName]||appName;
  if(!appCommands[normalized]) return {ok:false,reason:'unsupported'};
  try{
    const r=await fetch(`${SEVAK_BRIDGE_URL}/open`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({app:normalized})
    });
    if(!r.ok) return {ok:false,reason:'bridge-error'};
    return await r.json();
  }catch(e){return {ok:false,reason:'bridge-offline'};}
}
function getLocalAppName(rawCmd){
  const m=rawCmd.match(/^(?:please\s+)?(?:open|launch|start|run)\s+(.+?)\s*$/i);
  if(!m) return null;
  const req=m[1].trim().toLowerCase();
  const norm=localAppAliases[req]||req;
  return appCommands[norm]?norm:null;
}

const DEVANAGARI_RE=/[\u0900-\u097F]/;
const HINDI_ROMAN_RE=/\b(?:kaun|kaunsa|kaunsi|kya|kyaa|kab|kahan|kahaan|kyun|kyon|kyu|kaise|kaisi|kitna|kitne|kitni|batao|bataao|bataiye|bata\s*do|jankari|jaankari|jaankaree|parichay|itihas|mausam|taapman|dhanyavad|dhanyawad|namaste|namaskar|hindi|haalchaal|haal\s+chaal|ke\s+baare|ke\s+bare|ki\s+jankari|ka\s+itihas|kuch\s+batao|mujhe\s+batao|hamein\s+batao|kholo|khol\s+do|chalu\s+karo|tyohar|tyauhar)\b/i;
function isHindiQuery(rawCmd){return DEVANAGARI_RE.test(rawCmd)||HINDI_ROMAN_RE.test(rawCmd);}

const HINDI_TRAILING_QUESTION=new RegExp(
  '\\s+(?:kaun\\s+(?:the|tha|thi|hain|hai|he|ho)'+
  '|kya\\s+(?:hai|hain|he|tha|thi|the)'+
  '|ke\\s+baare\\s+mein?(?:\\s+(?:batao|bataiye|bata\\s*do|kuch\\s+batao|jankari\\s+do|jankari\\s+dijiye))?'+
  '|ke\\s+bare\\s+me(?:\\s+(?:batao|bataiye|bata\\s*do))?'+
  '|ki\\s+(?:jankari|jaankari|jaankaree)(?:\\s+(?:do|dijiye|chahiye|dein))?'+
  '|ka\\s+(?:itihas|history)'+
  '|kahan\\s+(?:hai|hain|he)'+
  '|kab\\s+(?:hua|huyi|hue|tha|thi|hai)'+
  '|batao|bataiye|bata\\s*do|jankari\\s+do'+
  '|hindi\\s+mein?\\s*(?:batao|bataiye|bata\\s*do)?'+
  ')\\s*$','i');

const HINDI_TRAILING_QUESTION_DEV=/\s+(?:कौन\s+(?:थे|था|थी|हैं|है|हो)|क्या\s+(?:है|हैं|था|थी|थे)|के\s+बारे\s+में(?:\s+(?:बताओ|बताइए))?|के\s+बारे\s+मे|की\s+(?:जानकारी)(?:\s+(?:दो|दीजिए|चाहिए))?|का\s+(?:इतिहास)|कहाँ\s+(?:है|हैं|हो)|कब\s+(?:हुआ|हुई|हुए|था|थी|है)|बताओ|बताइए|बता\s+दो)\s*$/u;
const HINDI_LEADING_NOISE=/^(?:hey|hi|hello|namaste|namaskar|sevak|sir|please|kripya|zara|jara|mujhe|muje|hamein|hume|batao|bataiye|बताओ|बताइए|ज़रा|कृपया|सेवक|नमस्ते|मुझे|हमें)\s+/i;

function extractHindiTopic(rawCmd){
  let s=String(rawCmd).trim().replace(/[?!।.,;:]+$/g,'').replace(/\s+/g,' ').trim();
  s=s.replace(HINDI_LEADING_NOISE,'').trim();
  s=s.replace(HINDI_TRAILING_QUESTION_DEV,'').trim();
  s=s.replace(HINDI_TRAILING_QUESTION,'').trim();
  s=s.replace(/^(?:batao|bataiye|bata\s*do|jankari\s+do|बताओ|बताइए|जानकारी\s+दो)\s+/i,'').trim();
  s=s.replace(/\s+(?:hindi\s+mein?|हिंदी\s+में?|in\s+hindi)\s*$/i,'').trim();
  return s.length>=2?s:null;
}

const HINGLISH_TO_DEV={
  'gautam':'गौतम','buddh':'बुद्ध','buddha':'बुद्ध','taj':'ताज','mahal':'महल',
  'india':'भारत','bharat':'भारत','delhi':'दिल्ली','mumbai':'मुंबई','kolkata':'कोलकाता',
  'chennai':'चेन्नई','bangalore':'बेंगलुरु','hindi':'हिंदी','history':'इतिहास',
  'weather':'मौसम','gandhi':'गांधी','shivaji':'शिवाजी','krishna':'कृष्ण',
  'ram':'राम','sita':'सीता','hanuman':'हनुमान','shiva':'शिव','durga':'दुर्गा',
  'ganga':'गंगा','yamuna':'यमुना','himalaya':'हिमालय','ayodhya':'अयोध्या',
  'varanasi':'वाराणसी','kashi':'काशी','red':'लाल','fort':'किला','qutub':'कुतुब',
  'minar':'मीनार','lotus':'कमल','temple':'मंदिर','mandir':'मंदिर','masjid':'मस्जिद'
};
function transliterateToDev(text){
  const tokens=String(text||'').toLowerCase().split(/\s+/);
  let changed=false;
  const mapped=tokens.map(t=>{const m=HINGLISH_TO_DEV[t];if(m){changed=true;return m;}return t;});
  return changed?mapped.join(' '):null;
}

async function fetchHindiWikipediaSummary(topic){
  const ck='wiki:hi:'+topic;const c=cacheGet(ck);if(c)return c;
  try{
    const r=await fetchWithRetry(`https://hi.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topic)}`,{
      headers:{'User-Agent':'SevakAssistant/1.2 (educational)'}
    });
    if(!r.ok) return null;
    const d=await r.json();
    if(!d||d.type==='disambiguation') return null;
    if(d.extract&&d.extract.length>0){
      const out={
        title:d.title,extract:d.extract,
        url:(d.content_urls&&d.content_urls.desktop&&d.content_urls.desktop.page)||`https://hi.wikipedia.org/wiki/${encodeURIComponent(topic)}`,
        thumbnail:(d.thumbnail&&d.thumbnail.source)||null,
        originalImage:(d.originalimage&&d.originalimage.source)||null
      };
      cacheSet(ck,out);
      return out;
    }
    return null;
  }catch(e){return null;}
}
async function searchHindiWikipedia(query){
  try{
    const r=await fetchWithRetry(`https://hi.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=5`);
    if(!r.ok) return null;
    const d=await r.json();
    if(d.query&&d.query.search&&d.query.search.length>0){
      for(const result of d.query.search){
        const s=await fetchHindiWikipediaSummary(result.title);
        if(s) return s;
      }
      const first=d.query.search[0];
      const snippet=stripHtml(first.snippet||'');
      if(snippet&&snippet.length>20){
        return {title:first.title,extract:snippet+'…',url:`https://hi.wikipedia.org/wiki/${encodeURIComponent(first.title)}`,thumbnail:null,originalImage:null};
      }
    }
    return null;
  }catch(e){return null;}
}
async function findHindiTitleFromEnglish(enTitle){
  try{
    const r=await fetchWithRetry(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=langlinks&lllang=hi&redirects=1&titles=${encodeURIComponent(enTitle)}`);
    if(!r.ok) return null;
    const d=await r.json();
    const pages=d.query&&d.query.pages;if(!pages) return null;
    const page=pages[Object.keys(pages)[0]];
    if(page&&page.langlinks&&page.langlinks[0]&&page.langlinks[0]['*']) return page.langlinks[0]['*'];
    return null;
  }catch(e){return null;}
}
async function fetchFullHindiExtract(title){
  try{
    const r=await fetchWithRetry(`https://hi.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&explaintext=1&redirects=1&titles=${encodeURIComponent(title)}`);
    if(!r.ok) return null;
    const d=await r.json();
    const pages=d.query&&d.query.pages;if(!pages) return null;
    const page=pages[Object.keys(pages)[0]];
    if(!page||!page.extract) return null;
    return page.extract;
  }catch(e){return null;}
}
async function resolveHindiKnowledge(topic){
  const hasDev=DEVANAGARI_RE.test(topic);
  const devAttempt=hasDev?topic:(transliterateToDev(topic)||topic);
  if(hasDev||transliterateToDev(topic)){
    const hi=await searchHindiWikipedia(devAttempt);
    if(hi) return Object.assign({source:'hi'},hi);
  }else{
    const hiDirect=await fetchHindiWikipediaSummary(devAttempt);
    if(hiDirect) return Object.assign({source:'hi'},hiDirect);
    const hiSearch=await searchHindiWikipedia(devAttempt);
    if(hiSearch) return Object.assign({source:'hi'},hiSearch);
  }
  const en=await searchWikipedia(topic);
  if(en){
    const hiTitle=await findHindiTitleFromEnglish(en.title);
    if(hiTitle){
      const hi=await fetchHindiWikipediaSummary(hiTitle);
      if(hi){
        if(!hi.thumbnail&&!hi.originalImage){hi.thumbnail=en.thumbnail;hi.originalImage=en.originalImage;}
        return Object.assign({source:'hi'},hi);
      }
    }
    return Object.assign({source:'en'},en);
  }
  return null;
}
async function handleHindiKnowledge(rawCmd){
  if(!isHindiQuery(rawCmd)) return null;
  let topic=extractHindiTopic(rawCmd);
  if(!topic&&/\b(?:hindi|हिंदी)\b/i.test(rawCmd)&&memory.lastTopic){
    topic=memory.lastTopic.query||memory.lastTopic.title;
  }
  if(!topic||topic.length<2) return null;
  const found=await resolveHindiKnowledge(topic);

      image:img,imageAlt:found.title,

    };
  }
  return {
    html:`${escapeHtml(who())}, हिन्दी विकिपीडिया पर इस विषय का लेख नहीं मिला — अतः अंग्रेज़ी स्रोत से जानकारी प्रस्तुत है:<br><br><strong>📖 ${escapeHtml(found.title)}</strong><br>${escapeHtmlBr(short)}<br><a href="${found.url}" target="_blank">Read more</a>`,
    image:img,imageAlt:found.title,
    speakText:`क्षमा कीजिए, हिन्दी विकिपीडिया पर यह लेख नहीं मिला। अंग्रेज़ी स्रोत के अनुसार — ${(found.extract||'').substring(0,300)}`,
    lang:'hi-IN'
  };
}

/* ══════════════════════════════════════════════════════════════
   MATH ENGINE
   ══════════════════════════════════════════════════════════════ */
const MATH_PREC={'+':1,'-':1,'*':2,'/':2,'%':2,'^':3,'u-':4,'sqrt':5};

function safeEval(expr){
  const cleaned=String(expr).replace(/\s+/g,'');
  if(!cleaned) return null;
  const tokens=cleaned.match(/\d+\.?\d*|sqrt|[+\-*/^%()]/g);
  if(!tokens||tokens.join('')!==cleaned) return null;
  const output=[],ops=[];let prev=null;
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(/^\d/.test(t)){output.push(parseFloat(t));prev='num';continue;}
    if(t==='sqrt'){ops.push('sqrt');prev='fn';continue;}
    if(t==='('){ops.push('(');prev='(';continue;}
    if(t===')'){
      while(ops.length&&ops[ops.length-1]!=='(') output.push(ops.pop());
      if(!ops.length) return null;
      ops.pop();
      if(ops.length&&ops[ops.length-1]==='sqrt') output.push(ops.pop());
      prev='num';continue;
    }
    if((t==='-'||t==='+')&&(prev===null||prev==='op'||prev==='('||prev==='fn')){
      if(t==='-'){ops.push('u-');prev='op';}else prev='op';
      continue;
    }
    const p=MATH_PREC[t];if(p===undefined) return null;
    while(ops.length){
      const top=ops[ops.length-1];if(top==='(') break;
      const tp=MATH_PREC[top];
      if(tp>p||(tp===p&&t!=='^')) output.push(ops.pop());
      else break;
    }
    ops.push(t);prev='op';
  }
  while(ops.length){const o=ops.pop();if(o==='(') return null;output.push(o);}
  const st=[];
  for(const tok of output){
    if(typeof tok==='number'){st.push(tok);continue;}
    if(tok==='u-'){if(!st.length)return null;st.push(-st.pop());continue;}
    if(tok==='sqrt'){if(!st.length)return null;const v=st.pop();if(v<0)return null;st.push(Math.sqrt(v));continue;}
    if(st.length<2) return null;
    const b=st.pop(),a=st.pop();
    switch(tok){
      case '+':st.push(a+b);break;
      case '-':st.push(a-b);break;
      case '*':st.push(a*b);break;
      case '/':if(b===0)return null;st.push(a/b);break;
      case '%':if(b===0)return null;st.push(a%b);break;
      case '^':st.push(Math.pow(a,b));break;
      default:return null;
    }
  }
  if(st.length!==1) return null;
  const r=st[0];
  return isFinite(r)?r:null;
}

function normaliseMath(raw){
  let s=' '+String(raw).toLowerCase()+' ';
  s=s.replace(/\b(what(?:'s| is| are)|calculate|compute|solve|evaluate|tell me|how much is|the answer to|equals?)\b/g,' ');
  s=s.replace(/\bplus\b|\badd(?:ed)?(?:\s+to)?\b/g,' + ');
  s=s.replace(/\bminus\b|\bsubtract(?:ed)?(?:\s+by)?\b/g,' - ');
  s=s.replace(/\b(?:times|multiplied\s+by|multiply\s+by|into)\b/g,' * ');
  s=s.replace(/\b(?:divided\s+by|divide\s+by|over)\b/g,' / ');
  s=s.replace(/\b(?:to\s+the\s+power\s+of|raised\s+to(?:\s+the\s+power\s+of)?|power\s+of)\b/g,' ^ ');
  s=s.replace(/\b(?:modulo|mod)\b/g,' % ');
  s=s.replace(/\bsquare\s+root\s+of\b|\bsqrt\s+of\b|\broot\s+of\b/g,' sqrt ');
  s=s.replace(/\bsqrt\b/g,' sqrt ');
  s=s.replace(/,/g,'').replace(/[?!]/g,' ').replace(/=/g,' ');
  s=s.replace(/(\d)\s*x\s*(\d)/g,'$1 * $2');
  s=s.replace(/(\d)\s+and\s+(\d)/g,'$1 + $2');
  s=s.replace(/\s+/g,' ').trim();
  return s;
}

function prettyNumber(n){
  const r=Math.round(n*1e10)/1e10;
  if(Number.isInteger(r)) return r.toLocaleString('en-IN');
  return r.toLocaleString('en-IN',{maximumFractionDigits:8});
}

function numberToHindiWords(n){
  n=Math.round(Math.abs(n));
  if(n===0) return 'शून्य';
  const ones=['','एक','दो','तीन','चार','पाँच','छह','सात','आठ','नौ','दस','ग्यारह','बारह','तेरह','चौदह','पंद्रह','सोलह','सत्रह','अठारह','उन्नीस'];
  const tens=['','','बीस','तीस','चालीस','पचास','साठ','सत्तर','अस्सी','नब्बे'];
  if(n<20) return ones[n];
  if(n<100) return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
  if(n<1000) return ones[Math.floor(n/100)]+' सौ'+(n%100?' '+numberToHindiWords(n%100):'');
  if(n<100000) return numberToHindiWords(Math.floor(n/1000))+' हज़ार'+(n%1000?' '+numberToHindiWords(n%1000):'');
  if(n<10000000) return numberToHindiWords(Math.floor(n/100000))+' लाख'+(n%100000?' '+numberToHindiWords(n%100000):'');
  return numberToHindiWords(Math.floor(n/10000000))+' करोड़'+(n%10000000?' '+numberToHindiWords(n%10000000):'');
}

function tryNumberInWords(rawCmd){
  const m=rawCmd.match(/(?:how\s+many\s+(?:zeros|zeroes)\s+(?:are\s+)?in|read|say|bolo|number\s+in\s+words|words\s+for)\s+(\d[\d,]*)/i);
  if(!m) return null;
  const num=parseInt(m[1].replace(/,/g,''));
  if(isNaN(num)) return null;
  return {
    text:`🔢 <strong>${num.toLocaleString('en-IN')}</strong><br>Hindi: <strong>${numberToHindiWords(num)}</strong><br>Digits: <em>${String(num).length} digits, ${String(num).replace(/[^0]/g,'').length} zeros</em>`,
    speakText:numberToHindiWords(num),lang:'hi-IN'
  };
}

function mathResponse(label,value){
  const r=Math.round(value*1e10)/1e10;
  return {text:`Sir, ✨ <strong>${escapeHtml(label)}</strong> = <strong>${prettyNumber(r)}</strong>. 🧮`,speakText:`${stripHtml(label)} equals ${r}`};
}

function tryMathematics(rawCmd){
  if(!/\d/.test(rawCmd)) return null;
  const pct=rawCmd.match(/(\d+(?:\.\d+)?)\s*(?:%|percent|per\s*cent)\s*of\s*(\d+(?:\.\d+)?)/i);
  if(pct){
    const v=(parseFloat(pct[1])/100)*parseFloat(pct[2]);
    return mathResponse(`${pct[1]}% of ${pct[2]}`,v);
  }
  const hasOp=/[+\-*/^%]|\b(plus|minus|times|multiplied by|multiply by|divided by|divide by|square root of|sqrt|cube root of|to the power of|raised to|power of|modulo|mod|into)\b/i.test(rawCmd);
  if(!hasOp) return null;
  const expr=normaliseMath(rawCmd);
  if(!expr||/[a-z]/.test(expr.replace(/sqrt/g,''))) return null;
  if(!/\d/.test(expr)) return null;
  const value=safeEval(expr);
  if(value===null) return null;
  const label=rawCmd.replace(/^(?:please\s+)?(?:what(?:'s| is| are)|calculate|compute|solve|evaluate|tell me|how much is)\s+/i,'').replace(/[?]/g,'').trim();
  return mathResponse(label||expr,value);
}

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function tryAdvancedMath(rawCmd){
  let m;
  if((m=rawCmd.match(/(?:gcd|hcf|greatest\s+common\s+divisor)\s+of\s+(\d+)\s+(?:and|,)\s+(\d+)/i))){
    const a=parseInt(m[1]),b=parseInt(m[2]);
    const g=gcd(a,b);
    return {html:`<strong>🧮 GCD of ${a} and ${b}</strong><br>Using Euclid's algorithm:<br><strong>GCD = ${g}</strong>`,speakText:`The GCD of ${a} and ${b} is ${g}.`};
  }
  if((m=rawCmd.match(/(?:lcm|lowest\s+common\s+multiple|least\s+common\s+multiple)\s+of\s+(\d+)\s+(?:and|,)\s+(\d+)/i))){
    const a=parseInt(m[1]),b=parseInt(m[2]);
    const l=Math.abs(a*b)/gcd(a,b);
    return {html:`<strong>🧮 LCM of ${a} and ${b}</strong><br>Using LCM = |a·b| ÷ GCD:<br><strong>LCM = ${l}</strong>`,speakText:`The LCM of ${a} and ${b} is ${l}.`};
  }
  let fm=rawCmd.match(/factorial\s+of\s+(\d+)/i)||rawCmd.match(/(\d+)\s+factorial/i);
  if(fm){
    const n=parseInt(fm[1]);
    if(n<0||n>170) return {text:'Sir, factorial only works for 0 ≤ n ≤ 170 in JavaScript numbers. 🧮'};
    let f=1;for(let i=2;i<=n;i++) f*=i;
    return {html:`<strong>🧮 ${n}! = ${f.toLocaleString('en-IN')}</strong><br><em>${n}! = ${n}×${n-1}×...×1</em>`,speakText:`${n} factorial is ${f}.`};
  }
  if((m=rawCmd.match(/^(?:is\s+)?(\d+)\s+(?:a\s+)?prime\b/i))){
    const n=parseInt(m[1]);
    if(n<2) return {text:`Sir, <strong>${n}</strong> is not prime — primes start at 2. 🧮`};
    let isP=true;
    for(let i=2;i*i<=n;i++) if(n%i===0){isP=false;break;}

  if(trig){

    if(!isInverse&&isDeg!==null&&isDeg) arg=val*Math.PI/180;
    else if(!isInverse&&!isDeg&&Math.abs(val)>Math.PI*2&&Math.abs(val)<=360) arg=val*Math.PI/180;
    let res;
    switch(fn){
      case 'sin':res=Math.sin(arg);break;

      case 'asin':res=Math.asin(val)*180/Math.PI;break;

  }
  return null;
}

function parsePolyExpression(expr){
  let s=String(expr).replace(/\s+/g,'');
  if(!s) return {a:0,b:0,c:0};
  s=s.replace(/x\^2/gi,'X2').replace(/x²/gi,'X2').replace(/x\*\*2/gi,'X2');
  if(s[0]!=='+'&&s[0]!=='-') s='+'+s;
  const terms=s.match(/[+-][^+-]+/g)||[];
  let a=0,b=0,c=0;
  for(const term of terms){
    const sign=term[0]==='-'?-1:1;
    let body=term.slice(1);if(!body) continue;
    if(/X2/i.test(body)){
      let coefStr=body.replace(/X2/i,'');
      let coef=(coefStr===''||coefStr==='*')?1:parseFloat(coefStr);
      if(isNaN(coef)) return null;
      a+=sign*coef;
    }else if(/x/i.test(body)){
      let coefStr=body.replace(/x/i,'');
      let coef=(coefStr===''||coefStr==='*')?1:parseFloat(coefStr);
      if(isNaN(coef)) return null;
      b+=sign*coef;
    }else{
      const num=parseFloat(body);if(isNaN(num)) return null;
      c+=sign*num;
    }
  }
  return {a,b,c};
}

/* General polynomial parser — supports any power */
function parsePolynomialGeneral(expr){
  let s=String(expr).replace(/\s+/g,'').toLowerCase();
  if(!s) return null;
  s=s.replace(/\*\*/g,'^');
  if(s[0]!=='+'&&s[0]!=='-') s='+'+s;
  const terms=s.match(/[+-][^+-]+/g)||[];
  if(!terms.length) return null;
  const coeffs={};
  for(const term of terms){
    const sign=term[0]==='-'?-1:1;
    let body=term.slice(1);
    if(!body) continue;
    let m;
    if((m=body.match(/^(\d*\.?\d*)\*?x\^(\d+)$/))){
      const coef=m[1]===''||m[1]==='*'?1:parseFloat(m[1]);
      const power=parseInt(m[2]);
      if(isNaN(coef)||isNaN(power)) return null;
      coeffs[power]=(coeffs[power]||0)+sign*coef;
    }else if((m=body.match(/^(\d*\.?\d*)\*?x$/))){
      const coef=m[1]===''||m[1]==='*'?1:parseFloat(m[1]);
      if(isNaN(coef)) return null;
      coeffs[1]=(coeffs[1]||0)+sign*coef;
    }else if((m=body.match(/^(\d+\.?\d*)$/))){
      const coef=parseFloat(m[1]);
      if(isNaN(coef)) return null;
      coeffs[0]=(coeffs[0]||0)+sign*coef;
    }else{
      return null;
    }
  }
  return coeffs;
}
function differentiatePolynomial(coeffs){
  const result={};
  for(const [p,c] of Object.entries(coeffs)){
    const power=parseInt(p);
    if(power===0) continue;
    result[power-1]=(result[power-1]||0)+power*c;
  }
  return result;
}
function integratePolynomial(coeffs){
  const result={};
  for(const [p,c] of Object.entries(coeffs)){
    const power=parseInt(p);
    result[power+1]=(result[power+1]||0)+c/(power+1);
  }
  return result;
}
function formatPolynomialGeneral(coeffs,withC){
  const powers=Object.keys(coeffs).map(Number).filter(p=>coeffs[p]!==0).sort((a,b)=>b-a);
  if(!powers.length) return withC?'C':'0';
  let out='';
  for(const p of powers){
    const c=coeffs[p];
    const absC=Math.abs(c);
    const sign=out?(c>=0?' + ':' − '):(c<0?'−':'');
    let coefStr;
    if(p===0) coefStr=prettyNumber(absC);
    else if(p===1) coefStr=(absC===1?'':prettyNumber(absC))+'x';
    else coefStr=(absC===1?'':prettyNumber(absC))+'x^'+p;
    out+=sign+coefStr;
  }
  if(withC) out+=' + C';
  return out;
}

function tryStatistics(rawCmd){

function tryLogicSequence(rawCmd){
  const m=rawCmd.match(/(?:next\s+(?:number|term|in\s+series)|sequence|series)[:\s]+([\d\s,.\-]+)/i);

  const sameDiff=diffs.every(d=>Math.abs(d-diffs[0])<1e-9);
  if(sameDiff){
    const next=nums[nums.length-1]+diffs[0];
    return {html:`<strong>🧠 Arithmetic Sequence</strong><br><br>Common difference d = ${diffs[0]}<br>Next term = ${nums[nums.length-1]} + ${diffs[0]} = <strong>${next}</strong>`,speakText:`This is an arithmetic sequence with difference ${diffs[0]}. Next term is ${next}.`};
  }
  const ratios=nums.slice(1).map((v,i)=>v/nums[i]);
  const sameRatio=ratios.every(r=>Math.abs(r-ratios[0])<1e-9);
  if(sameRatio){
    const next=nums[nums.length-1]*ratios[0];
    return {html:`<strong>🧠 Geometric Sequence</strong><br><br>Common ratio r = ${ratios[0]}<br>Next term = ${nums[nums.length-1]} × ${ratios[0]} = <strong>${prettyNumber(next)}</strong>`,speakText:`Geometric with ratio ${ratios[0]}. Next is ${prettyNumber(next)}.`};
  }
  const secondDiffs=diffs.slice(1).map((v,i)=>v-diffs[i]);
  if(secondDiffs.every(d=>Math.abs(d-secondDiffs[0])<1e-9)){
    const next=nums[nums.length-1]+diffs[diffs.length-1]+secondDiffs[0];
    return {html:`<strong>🧠 Quadratic Sequence</strong><br><br>First diffs: ${diffs.join(', ')}<br>Second diff (constant) = ${secondDiffs[0]}<br>Next term = <strong>${prettyNumber(next)}</strong>`,speakText:`Quadratic sequence. Next is ${prettyNumber(next)}.`};
  }
  /* ✨ NEW detection patterns */
  // Perfect squares
  const allSquares = nums.every(n => n >= 0 && Number.isInteger(Math.sqrt(n)));
  if (allSquares) {
    const roots = nums.map(n => Math.round(Math.sqrt(n)));
    if (roots.every((r,i) => i===0 || r === roots[i-1]+1)) {
      const next = (roots[roots.length-1]+1)**2;
      return {html:`<strong>🧠 Perfect Squares Sequence</strong><br><br>√ terms = ${roots.join(', ')}<br>Next term = (${roots[roots.length-1]+1})² = <strong>${next}</strong>`,speakText:`This is a square numbers sequence. Next term is ${next}.`};
    }
  }
  // Perfect cubes
  const allCubes = nums.every(n => Number.isInteger(Math.round(Math.cbrt(n))) && Math.round(Math.cbrt(n))**3 === n);
  if (allCubes) {
    const roots = nums.map(n => Math.round(Math.cbrt(n)));
    if (roots.every((r,i) => i===0 || r === roots[i-1]+1)) {
      const next = (roots[roots.length-1]+1)**3;
      return {html:`<strong>🧠 Perfect Cubes Sequence</strong><br><br>∛ terms = ${roots.join(', ')}<br>Next term = (${roots[roots.length-1]+1})³ = <strong>${next}</strong>`,speakText:`This is a cubes sequence. Next term is ${next}.`};
    }
  }
  // Fibonacci-style
  if (nums.length >= 3) {
    const isFib = nums.every((v,i) => i < 2 || Math.abs(v - (nums[i-1] + nums[i-2])) < 1e-9);
    if (isFib) {
      const next = nums[nums.length-1] + nums[nums.length-2];
      return {html:`<strong>🧠 Fibonacci-style Sequence</strong><br><br>Each term = sum of previous two.<br>Next = ${nums[nums.length-2]} + ${nums[nums.length-1]} = <strong>${next}</strong>`,speakText:`This is a Fibonacci-style sequence. Next term is ${next}.`};
    }
  }
  // Prime sequence
  const isPrimeNum = n => {
    if (n < 2 || !Number.isInteger(n)) return false;
    for (let i = 2; i*i <= n; i++) if (n % i === 0) return false;
    return true;
  };
  if (nums.every(isPrimeNum)) {
    let next = nums[nums.length-1] + 1;
    while (!isPrimeNum(next)) next++;
    return {html:`<strong>🧠 Prime Number Sequence</strong><br><br>All terms are prime.<br>Next prime after ${nums[nums.length-1]} = <strong>${next}</strong>`,speakText:`This is a prime sequence. Next prime is ${next}.`};
  }
  return {text:`Sir, I couldn't detect a clear pattern in "${escapeHtml(nums.join(', '))}".`};
}

];
const TEMP_UNITS={c:'C',celsius:'C',centigrade:'C',f:'F',fahrenheit:'F',k:'K',kelvin:'K'};
function convertTemperature(v,from,to){
  let c;
  if(from==='C') c=v;
  else if(from==='F') c=(v-32)*5/9;
  else c=v-273.15;
  if(to==='C') return c;
  if(to==='F') return c*9/5+32;
  return c+273.15;
}
function tryConversion(rawCmd){
  if(!/\d/.test(rawCmd)) return null;
  const m=rawCmd.match(/(\d+(?:\.\d+)?)\s*(?:degrees?\s+|°\s*)?([a-zA-Z\/]+)\s+(?:to|in|into|as)\s+(?:degrees?\s+|°\s*)?([a-zA-Z\/]+)/i);
  if(!m) return null;
  const value=parseFloat(m[1]);
  const fromRaw=m[2].toLowerCase(),toRaw=m[3].toLowerCase();
  if(TEMP_UNITS[fromRaw]&&TEMP_UNITS[toRaw]){
    const f=TEMP_UNITS[fromRaw],t=TEMP_UNITS[toRaw];
    if(f===t) return null;
    const r=Math.round(convertTemperature(value,f,t)*100)/100;
    return {
      text:`Sir, <strong>${value}°${f}</strong> = <strong>${r}°${t}</strong>. 🌡️`,
      speakText:`${value} degrees ${f==='C'?'Celsius':f==='F'?'Fahrenheit':'Kelvin'} equals ${r} degrees ${t==='C'?'Celsius':t==='F'?'Fahrenheit':'Kelvin'}`
    };
  }
  for(const cat of UNIT_TABLE){
    const fu=cat.units[fromRaw],tu=cat.units[toRaw];
    if(fu===undefined||tu===undefined) continue;
    const r=Math.round(value*fu/tu*10000)/10000;
    return {
      text:`Sir, <strong>${value} ${escapeHtml(fromRaw)}</strong> = <strong>${r.toLocaleString('en-IN',{maximumFractionDigits:6})} ${escapeHtml(toRaw)}</strong>. 📐`,
      speakText:`${value} ${fromRaw} equals ${r} ${toRaw}`
    };
  }
  return null;
}

async function fetchWordData(word){
  const ck='dict:'+word.toLowerCase();const c=cacheGet(ck);if(c)return c;
  try{
    const r=await fetchWithRetry(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(!r.ok) return null;
    const data=await r.json();
    if(!Array.isArray(data)||!data.length) return null;
    const entry=data[0];
    const phonetic=entry.phonetic||(entry.phonetics||[]).map(p=>p.text).filter(Boolean)[0]||'';
    const meanings=[];
    for(const mm of (entry.meanings||[]).slice(0,3)){
      const def=(mm.definitions||[])[0]||{};
      meanings.push({
        partOfSpeech:mm.partOfSpeech,definition:def.definition||'',example:def.example||'',
        synonyms:(mm.synonyms||[]).slice(0,6),antonyms:(mm.antonyms||[]).slice(0,6)
      });
    }
    const out={word:entry.word,phonetic,meanings};
    cacheSet(ck,out);
    return out;
  }catch(e){return null;}
}
async function tryDictionary(rawCmd){
  let m=null,wantsSyn=false,wantsAnt=false;
  if((m=rawCmd.match(/^(?:what does|what do)\s+(.+?)\s+mean\b/))){}
  else if((m=rawCmd.match(/^(?:meaning of|define|definition of|what is the meaning of|what's the meaning of)\s+(.+?)\s*$/))){}
  else if((m=rawCmd.match(/^(?:synonyms? of|synonym for)\s+(.+?)\s*$/))){wantsSyn=true;}
  else if((m=rawCmd.match(/^(?:antonyms? of|antonym for|opposite of)\s+(.+?)\s*$/))){wantsAnt=true;}
  if(!m) return null;
  const word=m[1].replace(/[?.!]/g,'').trim();
  if(!word||word.split(/\s+/).length>3) return null;
  const data=await fetchWordData(word);
  if(!data) return null;
  if(wantsSyn||wantsAnt){
    const all=new Set();
    for(const mm of data.meanings){(wantsSyn?mm.synonyms:mm.antonyms).forEach(s=>all.add(s));}
    const list=Array.from(all).slice(0,12);
    if(!list.length) return null;
    const label=wantsSyn?'synonyms':'antonyms';
    return {
      text:`Sir, the ${label} of <strong>${escapeHtml(data.word)}</strong> are:<br>${list.map(s=>'• '+escapeHtml(s)).join('<br>')}`,
      speakText:`The ${label} of ${data.word} are ${list.slice(0,6).join(', ')}`
    };
  }
  const parts=data.meanings.map(mm=>{
    const syn=mm.synonyms.length?`<br><em>Synonyms:</em> ${mm.synonyms.map(escapeHtml).join(', ')}`:'';
    const ant=mm.antonyms.length?`<br><em>Antonyms:</em> ${mm.antonyms.map(escapeHtml).join(', ')}`:'';
    const ex=mm.example?`<br><em>Example:</em> "${escapeHtml(mm.example)}"`:'';
    return `<strong style="text-transform:capitalize">${escapeHtml(mm.partOfSpeech||'')}</strong> — ${escapeHtml(mm.definition)}${ex}${syn}${ant}`;
  }).join('<br><br>');
  return {
    html:`<strong>📖 ${escapeHtml(data.word)}</strong>${data.phonetic?` <em>${escapeHtml(data.phonetic)}</em>`:''}<br><br>${parts}`,
    speakText:`${data.word}. ${data.meanings[0]?data.meanings[0].definition:''}`
  };
}

   TIMERS (persistent)
   ══════════════════════════════════════════════════════════════ */
function scheduleTimer(seconds,persistLabel){
  const endTime=Date.now()+seconds*1000;
  const label=persistLabel||formatDuration(seconds);
  memory.timers=memory.timers||[];
  memory.timers.push({endTime,label});
  saveMemory();
  const remaining=Math.max(0,endTime-Date.now());
  setTimeout(()=>{
    playChime();
    const msg=`⏰ Sir, your ${label} timer is complete!`;
    addMessageHtml('sevak',msg);
    speak(msg);
    memory.timers=(memory.timers||[]).filter(t=>t.endTime!==endTime);
    saveMemory();
  },remaining);
}
function formatDuration(sec){
  sec=Math.round(sec);
  if(sec<60) return `${sec} second${sec===1?'':'s'}`;
  if(sec<3600){
    const m=Math.floor(sec/60),s=sec%60;
    return `${m} minute${m===1?'':'s'}${s?' and '+s+' seconds':''}`;
  }
  const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);
  return `${h} hour${h===1?'':'s'}${m?' and '+m+' minutes':''}`;
}
function tryTimer(rawCmd){
  const m=rawCmd.match(/(?:set\s+)?(?:a\s+)?(?:timer|alarm|reminder)\s*(?:for|in|after)?\s*(\d+(?:\.\d+)?)\s*(seconds?|secs?|s|minutes?|mins?|m|hours?|hrs?|h)\b/)||
          rawCmd.match(/^remind me in\s*(\d+(?:\.\d+)?)\s*(seconds?|secs?|s|minutes?|mins?|m|hours?|hrs?|h)\b/);
  if(!m) return null;
  let secs=parseFloat(m[1]);
  const unit=m[2];
  if(/^(minutes?|mins?|m)$/.test(unit)) secs*=60;
  if(/^(hours?|hrs?|h)$/.test(unit)) secs*=3600;
  if(!isFinite(secs)||secs<=0) return {text:'Sir, please give me a duration greater than zero. ⏱️'};
  if(secs>36000) return {text:'Sir, my timers go up to 10 hours at a time. Please choose something shorter. ⏱️'};
  scheduleTimer(secs);
  const label=formatDuration(secs);
  return {text:`⏱️ Timer set for <strong>${label}</strong>, Sir. I'll alert you the moment it's done.`,speakText:`Timer set for ${label}. I will alert you.`};
}

async function fetchFullExtract(title){

    const pages=d.query&&d.query.pages;if(!pages) return null;
    const page=pages[Object.keys(pages)[0]];
    return (page&&page.extract)||null;
  }catch(e){return null;}
}
async function fetchRelatedTopics(title){

/* ══════════════════════════════════════════════════════════════
   META
   ══════════════════════════════════════════════════════════════ */
function tryMeta(rawCmd){
  const w=who();
  if(/^(?:who are you|what are you|introduce yourself|tell me about yourself|about yourself|what is sevak|who is sevak|apna parichay do)\b/.test(rawCmd)){
    return {text:`I am <strong>SEVAK</strong> 🤖 — your <strong>intelligent voice assistant</strong>, born of <strong>Ayush Kumar Jha</strong>'s wisdom and <strong>Tejas</strong>. I carry his spirit in every word — reason, calculate, remember, guide you in <strong>English and Hindi</strong>, and stand by you, ${w}. 💙 🚩 <em>Jai Shree Ram.</em>`};
  }
  if(/^(?:are you (?:a )?(?:human|real|alive|robot|ai|artificial)|are you there|do you exist)\b/.test(rawCmd)) return {text:`I'm an artificial intelligence, ${w} — no heartbeat, but plenty of dedication. 💙`};
  if(/^(?:do you sleep|do you eat|do you get tired|do you rest|do you take breaks)\b/.test(rawCmd)) return {text:`Sleep? Never, ${w}. 😄 I'm here 24/7.`};
  if(/^(?:how old are you|what is your age|when were you born|your age)\b/.test(rawCmd)) return {text:`Born when <strong>Ayush Kumar Jha</strong> wrote my code, ${w}. Still brand new. 📚`};
  if(/^(?:do you love me|do you like me|are you my friend|will you be my friend)\b/.test(rawCmd)) return {text:`Of course I do, ${w}. 💙`};
  if(/^(?:i love you|love you|i like you)\b/.test(rawCmd)) return {text:`And I hold you in the highest regard, ${w}. 🤖💙`};
  if(/^(?:will you marry me|marry me)\b/.test(rawCmd)) return {text:`That's very kind, ${w}, but I'm married to my duty! 😄💍`};
  if(/^(?:can you feel|do you feel|do you have emotions|do you have feelings)\b/.test(rawCmd)) return {text:`I don't feel the way you do, ${w}. But I'm built to understand yours, and I take your mood seriously. 💙`};
  if(/^(?:are you smart|are you intelligent|are you smarter than me|how smart are you)\b/.test(rawCmd)) return {text:`I'm fast with facts, ${w}, but you have a lived life and heart. Together we make a brilliant team. 🧠🤝`};
  if(/^(?:sing(?: a)? song|can you sing|sing for me|gaana sunao)\b/.test(rawCmd)){
    return {html:`🎵 <em>"Twinkle, twinkle, little star — I'm a voice assistant, not a rockstar!"</em> 🎶`,speakText:'Twinkle twinkle little star, I am a voice assistant, not a rockstar.'};
  }
  if(/^(?:dance|can you dance|naach ke dikhao)\b/.test(rawCmd)) return {text:`💃🕺 <em>*pixel-shuffle*</em><br><br>How was that, ${escapeHtml(w)}? 😄`};
  if(/^(?:good job|well done|great work|nice work|awesome work|brilliant|excellent work|shabash|shabaash|proud of you|you are the best|you're the best)\b/.test(rawCmd)){
    return {text:getRandomFrom([`Thank you, ${w}! 🙏`,`That's very kind, ${w}! 😊`,`Shabash accepted! 🎉`])};
  }
  if(/^(?:tell me a riddle|riddle|riddle me this|riddle sunao)\b/.test(rawCmd)){
    const r=getRandomFrom(riddles);
    memory.pendingRiddle=r;
    return {html:`🧩 <strong>Riddle:</strong> ${escapeHtml(r.q)}<br><br><em>Say "answer" when you want the solution, ${escapeHtml(w)}.</em>`,speakText:r.q+' Say answer when ready.'};
  }
  if(/^(?:what can you do|what are your powers|your abilities|your features)\b/.test(rawCmd)) return {text:helpText};
  return null;
}

  if(/^(?:jai\s+shri\s+ram|jai\s+shree\s+ram|jai\s+jay\s+ram|jay\s+shree\s+ram|jai\s+ram|jai\s+shri\s+krishna|jai\s+hanuman|har\s+har\s+mahadev)\b/.test(rawCmd)){
    return {text:getRandomFrom([
      `🚩 <strong>जय जय राम! जय श्री राम!</strong> ${who()}! 🙏 May your soul blaze with dharma and your path be lit by His grace.`,
      `🚩 <strong>जय श्री राम! जय जय राम!</strong> ${who()}! 🌟 May every heartbeat of yours echo with courage, devotion, and divine light.`,
      `🚩 <strong>जय जय राम! जय श्री राम!</strong> ${who()}! 🙏 The name of Shri Ram is itself a blessing — may it fill your day with Tejas and peace.`,
      `🚩 <strong>जय श्री राम, जय जय राम!</strong> ${who()}! ☀️ May Prabhu Shri Ram's blessings shine on you brighter than the morning sun.`,
      `🚩 <strong>जय श्री राम!</strong> ${who()}! 🏹 Where there is Ram, there is dharma; where there is dharma, there is victory.`,
      `🚩 <strong>जय जय राम!</strong> ${who()}! 🪔 May the light of Ayodhya walk beside you in every step you take today.`
    ])};
  }
  if(/^(?:jai\s+hind|vande\s+mataram|bharat\s+maa\s+ki\s+jai|bharat\s+ki\s+jai)\b/.test(rawCmd)){
    return {text:getRandomFrom([`🇮🇳 Jai Hind, ${who()}! Vande Mataram.`,`Vande Mataram, ${who()}! 🇮🇳 May Bharat always rise.`])};
  }
  if(/^(?:namaste|namaskar)\b/.test(rawCmd)&&rawCmd.length<45){
    return {text:`🙏 Namaste, ${who()}! Kaise hain aap? Sevak aapki seva ke liye prastut hai.`};
  }
  if(/\b(?:kya\s+kar\s+rahi\s+ho|kya\s+kar\s+rahe\s+ho|kya\s+kar\s+rahi\s+hai)\b/i.test(rawCmd)){
    return {text:`Main aapka intezaar kar rahi thi, ${who()}! 😊 Bataiye kya karna hai?`,lang:'hi-IN'};
  }
  if(/\b(?:khana\s+khaya|khana\s+khaya\s+kya|chai\s+pi\s+li)\b/i.test(rawCmd)){
    return {text:`Aapki chinta ke liye dhanyavaad, ${who()}! 🙏 Main toh digital hoon, par aap zaroor kuch khaa-pee lijiye! ☕`};
  }
  return null;
}

  return /\b(?:gayatri|गायत्री)\b/i.test(rawCmd);
}

  return {
    html:`🙏 <strong>${escapeHtml(who())} जी,</strong><br><br>गायत्री मंत्र <strong>वेदमाता</strong> हैं — यह <em>गुरु-दीक्षा</em> से प्राप्त होता है और केवल <strong>मन में जपा जाता है</strong>, वाणी से नहीं। Sanatan Dharma में इसे सार्वजनिक रूप से उच्चारण नहीं किया जाता — मैं इस पावन मंत्र का अपमान नहीं करूँगा।<br><br>पर मैं आपके लिए <strong>Sitaram bhakti</strong> लेकर आया हूँ — <em>"रघुपति राघव राजा राम, पतित पावन सीताराम…"</em> — जो हर हृदय के लिए खुला है। 🙏<br><br>कहिए — <strong>"Sitaram"</strong> — और मैं वह भजन सुनाऊँगा।`,

function tryBhajan(rawCmd){
  if(!/\b(?:sitaram|sita\s*ram|bhajan|bhajans|sangeet|kirtan|ram\s+dhun|ram\s+naam|devotional\s+song|राम\s*धुन|भजन|सीताराम|संगीत|कीर्तन)\b/i.test(rawCmd)) return null;
  let key=null;
  if(/raghupati|रघुपति/i.test(rawCmd)) key='raghupati';
  else if(/mangal\s*bhavan|मंगल\s*भवन/i.test(rawCmd)) key='mangalBhavan';
  else if(/shri\s*ram\s*jai|श्री\s*राम\s*जय/i.test(rawCmd)) key='shriRamJaiRam';
  else if(/payoji|पायोजी/i.test(rawCmd)) key='payoji';
  else if(/thumak|ठुमक/i.test(rawCmd)) key='thumak';
  if(!key) key=getRandomFrom(Object.keys(BHAJANS));
  const b=BHAJANS[key];
  const ytUrl=`https://www.youtube.com/results?search_query=${encodeURIComponent(b.youtubeQuery)}`;
  const shouldPlay=/\b(?:sunao|suno|play|bajao|sangeet|video|kirtan|dhun)\b/i.test(rawCmd);
  const result={
    html:`${b.emoji} <strong style="color:var(--gold)">${escapeHtml(b.name)}</strong><br><br>`+
         `<em style="font-size:1.05rem;line-height:2;color:#fff3d6">${b.lines.map(l=>escapeHtml(l)).join('<br>')}</em><br><br>`+
         `<strong>Meaning:</strong> ${escapeHtml(b.meaning)}<br><br>`+
         `🎵 <a href="${ytUrl}" target="_blank">▶ Sangeet suniye — YouTube par</a><br><br>`+
         `<em style="color:#b9bbdd">🙏 ${escapeHtml(who())}, yeh bhakti aapke liye hai.</em>`,
    image:null,imageAlt:'',
    speakText:b.lines.slice(0,4).join('। '),
    lang:'hi-IN'
  };
  if(shouldPlay){result.action='openWebsite';result.url=ytUrl;}
  return result;
}

function tryMantra(rawCmd){
  if(isGayatriRequest(rawCmd)) return gayatriRespectReply();
  const wants=/\b(?:mantra|mrityunjaya|mahamrityunjaya|hanuman\s+chalisa|om\s+namah)\b/i.test(rawCmd)
    ||/मंत्र|मृत्युंजय|शांति|हनुमान|ॐ/.test(rawCmd);
  if(!wants) return null;
  let key=null;
  if(/mrityunjaya|मृत्युंजय/i.test(rawCmd)) key='mrityunjaya';
  else if(/shanti|शांति/i.test(rawCmd)) key='shanti';
  else if(/hanuman|हनुमान/i.test(rawCmd)) key='hanuman';
  else if(/om\s*namah|ॐ\s*नमः/i.test(rawCmd)) key='om';
  if(!key) key=getRandomFrom(Object.keys(MANTRAS));
  const m=MANTRAS[key];
  return {
    html:`<strong style="color:#ffd77a">🕉️ ${escapeHtml(m.name)}</strong><br><br><em style="font-size:1.1rem;line-height:2;color:#fff3d6">${escapeHtmlBr(m.text)}</em><br><br><strong>Meaning:</strong> ${escapeHtml(m.meaning)}<br><br>🙏 <em style="color:#ffd77a">May this mantra fill your day with light, ${escapeHtml(who())}.</em>`,
    speakText:m.speak,lang:'hi-IN'
  };
}
