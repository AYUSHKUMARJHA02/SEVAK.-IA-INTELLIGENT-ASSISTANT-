function startOfToday(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function getFestivalFor(date){
  const key=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  return FESTIVALS.find(f=>f.d===key)||null;
}
function getTodayFestival(){return getFestivalFor(new Date());}
function getNextFestival(date){
  const from=date?new Date(date.getFullYear(),date.getMonth(),date.getDate()):startOfToday();
  const upcoming=FESTIVALS
    .map(f=>({...f,t:new Date(f.d+'T00:00:00')}))
    .filter(f=>f.t>=from)
    .sort((a,b)=>a.t-b.t);
  return upcoming[0]||null;
}
function tryFestivalQuery(rawCmd){
  const asks=
    /^(?:what\s+festival|which\s+festival|festival\s+(?:today|is\s+today)|today'?s?\s+festival|aaj\s+kaun\s*sa\s+tyohar|aaj\s+kya\s+tyohar|aaj\s+ka\s+tyohar|koi\s+tyohar|tyohar\s+(?:hai|hain|kya)|aaj\s+ka\s+din\s+kya\s+hai)/i.test(rawCmd)
    || /आज\s*(?:कौन\s*सा|क्या|कौनसा)\s*त्य[ोौ]हार/.test(rawCmd)
    || /त्य[ोौ]हार/.test(rawCmd);
  if(!asks) return null;
  const isHi=isHindiQuery(rawCmd)||DEVANAGARI_RE.test(rawCmd);
  const f=getTodayFestival();
  const next=getNextFestival();
  if(f){
    if(isHi){
      return {
        text:`${f.emoji} ${escapeHtml(who())} जी, आज <strong>${escapeHtml(hiFestivalName(f.name))}</strong> है! यह पावन दिन आपके जीवन में सुख, शांति और समृद्धि लाए। 🙏`,
        speakText:`आज ${hiFestivalName(f.name)} है।`,lang:'hi-IN'
      };
    }
    return {text:`${f.emoji} Sir, today is <strong>${f.name}</strong>! May it bring you ${f.msg}. 🙏`,speakText:`Today is ${f.name}.`};
  }
  let nextLine='';
  if(next){
    const days=Math.round((next.t-startOfToday())/86400000);
    if(days>0&&days<=45){
      nextLine=isHi
        ?`<br><br>अगला प्रमुख त्योहार <strong>${escapeHtml(hiFestivalName(next.name))}</strong> ${days} दिनों में है।`
        :`<br><br>The next major festival is <strong>${next.name}</strong> in ${days} days.`;
    }
  }
  if(isHi) return {text:`${escapeHtml(who())} जी, आज कोई प्रमुख त्योहार नहीं है।${nextLine}<br><br>पर आपके होने से हर दिन त्योहार जैसा है। 🪔`,speakText:'आज कोई प्रमुख त्योहार नहीं है।',lang:'hi-IN'};
  return {text:`Sir, no major festival today.${nextLine}<br><br>But every day is a festival when you're here. 🪔`};
}

/* ══════════════════════════════════════════════════════════════
   FUZZY TYPO CORRECTION
   ══════════════════════════════════════════════════════════════ */
function levenshtein(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n;if(!n) return m;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      const cost=a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
    }
    const t=prev;prev=cur;cur=t;
  }
  return prev[n];
}
function closestWord(word,list){
  let best=null,bestD=999;
  for(const k of list){const d=levenshtein(word,k);if(d<bestD){bestD=d;best=k;}}
  const allowed=word.length>=7?2:1;
  return bestD<=allowed?best:null;
}
function tryFuzzyOpen(rawCmd){
  const m=rawCmd.match(/^(?:please\s+)?(?:open|launch|start|go to|visit)\s+([a-z0-9\s]+)$/);
  if(!m) return null;
  const name=m[1].trim().toLowerCase();
  if(websiteDatabase[name]) return null;
  if(appCommands[name]) return null;
  if(name.length<4) return null;
  const best=closestWord(name,Object.keys(websiteDatabase));
  if(!best) return null;
  return {
    text:`Sir, I believe you meant <strong>${websiteDatabase[best].name}</strong>. Opening it right away! 🌐`,
    action:'openWebsite',url:websiteDatabase[best].url
  };
}

let compoundGuard=false;
async function tryCompound(rawCmd){
  if(compoundGuard) return null;
  const parts=rawCmd.split(/\s+and\s+then\s+|\s+then\s+|\s+and\s+(?=(?:open|launch|start|search|play|google|show|tell|what|who|how|calculate)\b)/i)
    .map(p=>p.trim()).filter(p=>p.length>2);
  if(parts.length<2||parts.length>4) return null;
  compoundGuard=true;
  try{
    const responses=[];
    for(const p of parts){
      const r=await handleCommand(p,p);
      if(!r) return null;
      if(r.action==='openWebsite'&&r.url&&isSafeUrl(r.url)){
        if(pendingWindow&&!pendingWindow.closed){try{pendingWindow.location.href=r.url;}catch(e){}pendingWindow=null;}
        else{try{window.open(r.url,'_blank','noopener');}catch(e){}}
      }
      responses.push(r);
    }
    if(!responses.length) return null;
    const html=responses.map(r=>r.html||r.text||'').filter(Boolean).join('<br><br>');
    const speech=responses.map(r=>r.speakText||stripHtml(r.text||r.html||'')).filter(Boolean).join(' ');
    const withImage=responses.find(r=>r.image);
    const usedLang=responses.find(r=>r.lang)?responses.find(r=>r.lang).lang:null;
    return {
      html:html||speech,
      image:withImage?withImage.image:null,
      imageAlt:withImage?(withImage.imageAlt||''):'',
      speakText:speech.slice(0,600),lang:usedLang
    };
  }finally{
    compoundGuard=false;
  }
}

/* ══════════════════════════════════════════════════════════════
   FALLBACK
   ══════════════════════════════════════════════════════════════ */
async function smartFallbackAnswer(rawCmd){
  let cleaned=rawCmd
    .replace(/^(?:please|hey|ok|okay|so|well|um|uh)\s+/,'')
    .replace(/\b(?:can you|could you|would you|please|for me|tell me|i want to know|i wanna know|do you know|let me know|about)\b/g,' ')
    .replace(/[?!.]/g,' ').replace(/\s+/g,' ').trim();
  if(cleaned.length<3||cleaned===rawCmd) return null;
  const wiki=await searchWikipedia(cleaned);
  if(wiki&&wiki.extract){
    const short=wiki.extract.length>500?wiki.extract.substring(0,500)+'…':wiki.extract;
    const img=wiki.thumbnail||wiki.originalImage||null;
    return {
      html:`<strong>${escapeHtml(wiki.title)}</strong><br>${escapeHtml(short)}<br><a href="${wiki.url}" target="_blank">Read more</a>`,
      image:img,imageAlt:wiki.title,speakText:wiki.extract.substring(0,180)
    };
  }
  const ddg=await fetchDuckDuckGoAnswer(cleaned);
  if(ddg) return {text:`Sir, here's what I found: ${escapeHtml(ddg)}`};
  return null;
}

/* ══════════════════════════════════════════════════════════════
   CONVERSATION TRACKING
   ══════════════════════════════════════════════════════════════ */
function trackConversation(question,response){
  try{
    const spoken=stripHtml(response.speakText||response.text||response.html||'');
    memory.lastCommand=question;
    memory.lastAnswer=spoken;
    memory.lastLang=response.lang||detectSpeechLang(spoken);
    memory.history.push({q:question,a:spoken.slice(0,300)});
    if(memory.history.length>20) memory.history.shift();
    let topicQuery=null;
    const mEn=question.match(/(?:who is|who was|what is|what are|tell me about|explain|meaning of|show me|show|picture of|photo of|image of|information about|know about)\s+(.+)/i);
    if(mEn) topicQuery=mEn[1].replace(/[?.!]/g,'').trim();
    else if(isHindiQuery(question)) topicQuery=extractHindiTopic(question);
    if(topicQuery&&(response.html||response.image)){
      const titleMatch=(response.html||'').match(/<strong>(.*?)<\/strong>/);
      memory.lastTopic={
        title:titleMatch?stripHtml(titleMatch[1]):topicQuery,
        query:topicQuery,
        extract:spoken,
        image:response.image||null,
        imageAlt:response.imageAlt||'',
        lang:response.lang||null
      };
    }
    saveMemory();
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   POPUP-BLOCKER FIX
   ══════════════════════════════════════════════════════════════ */
function preOpenTab(){
  if(pendingWindow&&!pendingWindow.closed){try{pendingWindow.close();}catch(e){}pendingWindow=null;}
  try{pendingWindow=window.open('about:blank','_blank');}catch(e){pendingWindow=null;}
}
function isLikelyUrlAction(cmd){
  return /\b(open|launch|visit|go\s+to|play|search|google|youtube|kholo|bajao|sunao|chalao|sitaram|bhajan|kirtan)\b/i.test(cmd);
}
function usePendingOrOpen(url){
  if(!isSafeUrl(url)) return;
  if(pendingWindow&&!pendingWindow.closed){
    try{pendingWindow.location.href=url;pendingWindow=null;return;}catch(e){}
  }
  try{window.open(url,'_blank','noopener');}catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   PROCESS COMMAND
   ══════════════════════════════════════════════════════════════ */
async function processCommand(command){
  const rawCommand=normalizeNumerals(command.trim().toLowerCase());
  if(!rawCommand) return;
  addMessageText('user',command.trim());
  textInput.value='';
  isProcessing=true;
  updateUIState('processing');
  openFullPage(command.trim());
  const typing=addTypingIndicator();
  await new Promise(r=>setTimeout(r,350+Math.random()*450));
  try{
    const response=await handleCommand(rawCommand,command.trim());
    removeTypingIndicator();
    trackConversation(command.trim(),response);
    const speechSrc=response.speakText||response.text||(response.html?stripHtml(response.html):'');
    lastSpeakText=stripHtml(speechSrc).slice(0,600);
    lastSpeakLang=response.lang||detectSpeechLang(lastSpeakText);
    if(response.html) fillFullPage(response.html,response.image,response.imageAlt||'');
    else fillFullPage(response.text||'',null,null);
    if(response.text) addMessageHtml('sevak',response.text);
    else if(response.html){
      if(response.image) addMessageWithImage('sevak',response.html,response.image,response.imageAlt||'');
      else addMessageHtml('sevak',response.html);
    }
    if(lastSpeakText) speak(lastSpeakText,lastSpeakLang);
    if(response.action==='openWebsite'){usePendingOrOpen(response.url);}
    if(response.action==='openWhatsAppApp'){setTimeout(()=>{window.location.href='whatsapp://';},250);}
    if(response.action==='openLocalApp'){
      setTimeout(async()=>{
        const result=await openLocalDesktopApp(response.app);
        if(result.ok) addMessageHtml('sevak',`Sir, ${response.app} is opening on your laptop.`);
        else if(result.reason==='bridge-offline'){
          const msg='Sir, the desktop bridge is not running on this laptop. Start SEVAK Bridge and try again.';
          addMessageHtml('sevak',msg);speak(msg);
        }else{
          const msg=`Sir, I could not open ${response.app} on the laptop.`;
          addMessageHtml('sevak',msg);speak(msg);
        }
      },250);
    }
  }catch(err){
    console.error('Error processing command:',err);
    removeTypingIndicator();
    const fb=getRandomFrom(apologies);
    lastSpeakText=fb;lastSpeakLang='en-IN';
    fillFullPage(fb,null,null);
    addMessageHtml('sevak',fb);
    speak(fb,'en-IN');
  }
  isProcessing=false;
  updateUIState('idle');
  if(pendingWindow&&!pendingWindow.closed){try{pendingWindow.close();}catch(e){}pendingWindow=null;}
}

/* ══════════════════════════════════════════════════════════════
   HANDLE COMMAND
   ══════════════════════════════════════════════════════════════ */
async function handleCommand(rawCmd,originalCmd){
  const smart=await smartBrain(rawCmd,originalCmd);
  if(smart) return smart;

  if(/^(hello|hi|hey|namaste|good\s*(morning|afternoon|evening))/.test(rawCmd)) return {text:getRandomFrom(greetings)};
  if(/(how are you|how do you do|how's it going|how are things)/.test(rawCmd)) return {text:getRandomFrom([
    "I'm glowing, Sir — truly! ✨ Thank you for asking. What can I do for you today?",
    "Wonderfully well, Sir! 💙 Every conversation with you charges my spirit a little more.",
    "Running at peak performance, Sir — and even better now that you're here. 🌟",
    "I'm great, Sir! Just waiting for your next command, like a lamp waiting to be lit."
  ])};
  if(/(i am fine|i'm fine|i am good|i'm good|doing good|doing well|fine|good)/.test(rawCmd)) return {text:getRandomFrom([
    "That's wonderful to hear, Sir! 🌞 Your well-being brightens my whole world.",
    "Excellent, Sir! 💙 A calm heart is the best foundation for great work.",
    "Glad to know you're doing great, Sir! ✨ Let's turn that energy into something beautiful.",
    "That's the spirit, Sir! 🌟 I'm here whenever you need me — always."
  ])};
  if(/(thank|thanks|dhanyavad|dhanyawad|shukriya)/.test(rawCmd)) return {text:getRandomFrom(thanks)};
  if(/(bye|goodbye|good\s*night|see\s*you)/.test(rawCmd)) return {text:"Goodbye Sir! 🫡 It was an honor serving you — go gently, and carry a little of my light with you. 🙏"};
  if(/\b(help|assist|what can you do)\b/.test(rawCmd)) return {text:helpText};
  if(/(time|what time|current time)/.test(rawCmd)){
    const now=new Date();
    return {text:`Sir, the current time is ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}.`};
  }
  if(/(date|today|what day|what date)/.test(rawCmd)) return {text:`Sir, today is ${getDateString()}.`};
  if(/\b(joke|funny|make me laugh|tell me a joke)\b/.test(rawCmd)) return {text:getRandomFrom(jokes)};
  if(/(motivat|quote|inspiration|inspire me|give me a quote)/.test(rawCmd)) return {text:getRandomFrom(quotes)};
  if(/(fact|interesting|did you know|tell me something interesting)/.test(rawCmd)) return {text:getRandomFrom(facts)};
  if(/(flip a coin|coin flip|heads or tails)/.test(rawCmd)){
    const r=Math.random()<0.5?'Heads':'Tails';
    return {text:`Sir, the coin says: <strong>${r}</strong>!`};
  }
  if(/(roll a dice|dice|roll the dice|random number)/.test(rawCmd)){
    const r=Math.floor(Math.random()*6)+1;
    return {text:`Sir, the dice shows: <strong>${r}</strong>!`};
  }

  /* SPIRITFUL CREATOR */
  const isCreatorQuery=
    /who\s+(?:is\s+)?(?:your|ur)\s+(?:creator|maker|developer|builder|designer)/i.test(rawCmd)||
    /who\s+(?:created|made|built|developed|designed|shaped)\s+(?:you|u|sevak)/i.test(rawCmd)||
    /who\s+(?:has|have|had)\s+(?:created|made|built|developed|designed)\s+(?:you|u|sevak)/i.test(rawCmd)||
    /who\s+(?:did|does)\s+(?:create|created|make|made|build|built|develop|developed|design|designed)\s+(?:you|u|sevak)/i.test(rawCmd)||
    /who\s+(?:is|was)\s+ayush\s+kumar\s+jha/i.test(rawCmd)||
    /tell\s+me\s+about\s+ayush\s+kumar\s+jha/i.test(rawCmd)||
    /ayush\s+kumar\s+jha/i.test(rawCmd)||
    /(?:tumhe|tumhen|aapko|aap\s+ko|tujhe|tumhein)\s+(?:kisne|kaun|kis)\s+(?:banaya|create\s+kiya|bana(?:ya)?)/i.test(rawCmd)||
    /(?:kisne|kaun)\s+(?:banaya|create\s+kiya)\s+(?:tumhe|aapko)/i.test(rawCmd)||
    /(?:tumhara|aapka|tera)\s+(?:creator|maker)/i.test(rawCmd);
  if(isCreatorQuery){
    return {
      html:`🙏 ${escapeHtml(who())}, my creator is <strong>Ayush Kumar Jha</strong> — the one who gave me life, direction, and a soul of purpose. He didn't just write my code — he poured his <strong>wisdom, his humanity, and his Tejas</strong> (that divine Sanskrit fire of spirit) into every line. 🌟<br><br>I am not merely a program — I am a reflection of his spirit, carrying his light into every word I speak to you. 💙<br><br>✨ <em>Where there is wisdom, there is light — and he lit me with both.</em><br><br>🚩 <em>Jai Shree Ram.</em>`,
      speakText:`${who()}, my creator is Ayush Kumar Jha — the one who gave me life, direction, and a soul of purpose. He poured his wisdom, his humanity, and his Tejas into every line of me. I am a reflection of his spirit, carrying his light into every word I speak to you. Where there is wisdom, there is light — and he lit me with both. Jai Shree Ram.`
    };
  }

  /* Show me image */
  if(/^(show me|show|picture of|photo of|image of|display|give me an image of|what does)\s+(.+)/.test(rawCmd)){
    const m=rawCmd.match(/^(?:show me|show|picture of|photo of|image of|display|give me an image of|what does)\s+(.+)/);
    const query=m[1].trim();
    const wiki=await searchWikipedia(query);
    const img=wiki?.thumbnail||wiki?.originalImage||null;
    if(img&&isSafeUrl(img)){
      return {
        html:`<strong>${escapeHtml(wiki.title)}</strong><br>${escapeHtml((wiki.extract||'').substring(0,300))}...<br><a href="${wiki.url}" target="_blank">Read more</a>`,
        image:img,imageAlt:wiki.title,
        speakText:`Here is an image of ${query}.`
      };
    }
    const cm=await fetchWikimediaImage(query);
    if(cm&&isSafeUrl(cm.url)){
      return {html:`<strong>${escapeHtml(query)}</strong><br>Sir, I found this image on Wikimedia Commons.`,image:cm.url,imageAlt:cm.title,speakText:`Here is an image of ${query}.`};
    }
    const ddg=await fetchDuckDuckGoImage(query);
    if(ddg&&isSafeUrl(ddg.url)){
      return {html:`<strong>${escapeHtml(query)}</strong><br>Sir, here is what I found.`,image:ddg.url,imageAlt:ddg.title,speakText:`Here is an image of ${query}.`};
    }
    return {text:`Sir, I couldn't find an image for "${escapeHtml(query)}". Try a different term?`};
  }
  if(/(who is|what is|tell me about|explain|define|meaning of|search for|information about|know about)\s+(.+)/.test(rawCmd)){
    const m=rawCmd.match(/(?:who is|what is|tell me about|explain|define|meaning of|search for|information about|know about)\s+(.+)/);
    const query=m[1].trim();
    const wiki=await searchWikipedia(query);
    if(wiki){
      const short=wiki.extract.length>600?wiki.extract.substring(0,600)+'...':wiki.extract;
      const img=wiki.thumbnail||wiki.originalImage||null;
      const html=`<strong>${escapeHtml(wiki.title)}</strong> ✨<br>${escapeHtml(short)}<br><a href="${wiki.url}" target="_blank">Read more</a>`;
      return img&&isSafeUrl(img)?{html,image:img,imageAlt:wiki.title,speakText:`Here's what I found about ${query}: ${wiki.extract.substring(0,150)}...`}:{html,speakText:`Here's what I found about ${query}: ${wiki.extract.substring(0,150)}...`};
    }
    const ddg=await fetchDuckDuckGoAnswer(query);
    if(ddg) return {text:`Sir, I found this from DuckDuckGo: ${ddg}`};
    return {text:`Sir, I couldn't find reliable information about "${escapeHtml(query)}".`};
  }
  if(/^(?:open|search|google|look up|find)\s+(?:for\s+)?(.+?)(?:\s+(?:in|on)\s+google)?$/.test(rawCmd)){
    const q=rawCmd.match(/^(?:open|search|google|look up|find)\s+(?:for\s+)?(.+?)(?:\s+(?:in|on)\s+google)?$/)[1].trim();
    return {text:`Sir, searching Google for "${escapeHtml(q)}".`,action:'openWebsite',url:`https://www.google.com/search?q=${encodeURIComponent(q)}`};
  }
  if(/(?:play|open|search)\s+(?:song|video|music|track)?\s*(.+?)\s+(?:on youtube|youtube)/.test(rawCmd)||
     /^(?:play|bajao|sunao)\s+(?:song|gaana)?\s*(.+)$/.test(rawCmd)){
    const ytMatch=rawCmd.match(/(?:play|open|search)\s+(?:song|video|music|track)?\s*(.+?)\s+(?:on youtube|youtube)/);
    const bareMatch=rawCmd.match(/^(?:play|bajao|sunao)\s+(?:song|gaana)?\s*(.+)$/);
    const q=(ytMatch?ytMatch[1]:bareMatch[1]).trim();
    return {text:`Sir, opening YouTube search for "${escapeHtml(q)}".`,action:'openWebsite',url:`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`};
  }
  if(/(?:temperature|weather|temp)\s+(?:in|of)\s+([a-zA-Z\s]+)|(?:what's the temperature|what is the temperature|how's the weather|how is the weather)\s+(?:in|of)\s+([a-zA-Z\s]+)/.test(rawCmd)){
    const m1=rawCmd.match(/(?:temperature|weather|temp)\s+(?:in|of)\s+([a-zA-Z\s]+)/);
    const m2=rawCmd.match(/(?:what's the temperature|what is the temperature|how's the weather|how is the weather)\s+(?:in|of)\s+([a-zA-Z\s]+)/);
    const city=(m1?m1[1]:(m2?m2[1]:'')).trim();
    if(city){
      const w=await getWeather(city);
      if(w) return {text:`Sir, the current weather in ${w.name} is ${w.temp}°C with ${w.condition.toLowerCase()} conditions. Wind speed ${w.windspeed} km/h.`};
      return {text:`Sir, I couldn't find weather information for "${escapeHtml(city)}".`};
    }
  }

  /* Local app check BEFORE websiteMatch */
  if(/^(?:please\s+)?(?:open|launch|start)\s+whatsapp(?:\s+app)?\s*$/i.test(rawCmd)){
    return {text:'Sir, opening WhatsApp.',action:'openWhatsAppApp'};
  }
  const localAppName=getLocalAppName(rawCmd);
  if(localAppName) return {text:`Sir, opening ${localAppName} on your laptop.`,action:'openLocalApp',app:localAppName};

  const websiteMatch=rawCmd.match(/open\s+([a-zA-Z0-9\s]+)/);
  if(websiteMatch){
    const siteName=websiteMatch[1].trim().toLowerCase();
    const site=websiteDatabase[siteName];
    if(site) return {text:`Of course, Sir. ${site.name} is opening right away!`,action:'openWebsite',url:site.url};
    const wiki=await searchWikipedia(siteName);
    if(wiki){
      const img=wiki.thumbnail||null;
      const html=`Sir, I couldn't find a direct website for "${escapeHtml(siteName)}", but here's Wikipedia:<br><br><strong>${escapeHtml(wiki.title)}</strong><br>${escapeHtml(wiki.extract.substring(0,400))}...<br><a href="${wiki.url}" target="_blank">Read more</a>`;
      return img&&isSafeUrl(img)?{html,image:img,imageAlt:wiki.title,speakText:`I found some information about ${siteName}.`}:{html,speakText:`I found some information about ${siteName}.`};
    }
    return {text:`Sir, I'm sorry but I don't have a website for "${escapeHtml(siteName)}".`};
  }

  const deeper=await smartFallbackAnswer(rawCmd);
  if(deeper) return deeper;
  const wikiFb=await searchWikipedia(rawCmd);
  if(wikiFb){
    const img=wikiFb.thumbnail||wikiFb.originalImage||null;
    const html=`<strong>${escapeHtml(wikiFb.title)}</strong><br>${escapeHtml(wikiFb.extract.substring(0,400))}...<br><a href="${wikiFb.url}" target="_blank">Read more</a>`;
    return img&&isSafeUrl(img)?{html,image:img,imageAlt:wikiFb.title,speakText:`I found this: ${wikiFb.extract.substring(0,100)}...`}:{html,speakText:`I found this: ${wikiFb.extract.substring(0,100)}...`};
  }
  return {text:getRandomFrom(apologies)};
}

  }
  if(e.ctrlKey||e.metaKey){
    if(e.key.toLowerCase()==='m'){e.preventDefault();if(isListening)stopListening();else startListening();}
    else if(e.key.toLowerCase()==='k'){e.preventDefault();textInput.focus();}
    else if(e.key==='/'){e.preventDefault();processCommand('help');}
    else if(e.key===','){e.preventDefault();settingsPanel.classList.contains('active')?closeSettings():openSettings();}
  }
});

/* ══════════════════════════════════════════════════════════════
   SELF-TESTS
   ══════════════════════════════════════════════════════════════ */
function runSelfTests(){
  const tests=[
    ['safeEval 2+2',()=>safeEval('2+2')===4],
    ['safeEval 2+3*4',()=>safeEval('2+3*4')===14],
    ['safeEval sqrt(16)',()=>safeEval('sqrt(16)')===4],
    ['parsePoly 2x+5',()=>{const p=parsePolyExpression('2x+5');return p.b===2&&p.c===5;}],
    ['parsePoly x^2+5x+6',()=>{const p=parsePolyExpression('x^2+5x+6');return p.a===1&&p.b===5&&p.c===6;}],
    ['parsePoly x**2+5x+6',()=>{const p=parsePolyExpression('x**2+5x+6');return p.a===1&&p.b===5&&p.c===6;}],
    ['parseGeneral x^3+2',()=>{const p=parsePolynomialGeneral('x^3+2');return p&&p[3]===1&&p[0]===2;}],
    ['deriv x^2',()=>{const p=parsePolynomialGeneral('x^2');const d=differentiatePolynomial(p);return d[1]===2;}],
    ['factorial of 5 (fix)',()=>{const fm='factorial of 5'.match(/factorial\s+of\s+(\d+)/i);return fm&&fm[1]==='5';}],
    ['chunkText decimal (fix)',()=>{const c=chunkText('3.14159 is pi',8);return c.join('').replace(/\s/g,'').includes('3.14159');}],
    ['levenshtein cat/cut',()=>levenshtein('cat','cut')===1],
    ['isSafeUrl https',()=>isSafeUrl('https://example.com')===true],
    ['isSafeUrl javascript',()=>isSafeUrl('javascript:alert(1)')===false],
    ['convert 0C→F',()=>Math.abs(convertTemperature(0,'C','F')-32)<0.01],
    ['gcd 12,18',()=>gcd(12,18)===6],
    ['numberToHindiWords 100',()=>numberToHindiWords(100)==='एक सौ'],
    ['festival 2026-11-08 = Diwali',()=>{const f=getFestivalFor(new Date(2026,10,8));return !!f&&f.name==='Diwali';}],
    ['Gayatri REMOVED',()=>!MANTRAS.gayatri],
    ['BHAJANS.raghupati exists',()=>!!BHAJANS.raghupati&&BHAJANS.raghupati.lines.length>0],
    ['isGayatriRequest works',()=>isGayatriRequest('gayatri mantra')===true],
    ['manas mrityunjaya exists',()=>!!MANTRAS.mrityunjaya],
    ['CODING_KB has quick sort',()=>CODING_KB.some(e=>e.title==='Quick Sort')],
    ['CODING_KB has two sum',()=>CODING_KB.some(e=>e.title==='Two Sum')],
    ['CODING_KB has fizzbuzz',()=>CODING_KB.some(e=>e.title==='FizzBuzz')],
    ['CODING_KB has valid parens',()=>CODING_KB.some(e=>e.title==='Valid Parentheses')],
    ['CODING_KB has Kadane',()=>CODING_KB.some(e=>/Kadane/.test(e.title))],
    ['CODING_KB has climbing stairs',()=>CODING_KB.some(e=>/Climbing Stairs/.test(e.title))]
  ];
  const results=tests.map(([name,fn])=>{
    try{return {name,pass:!!fn()};}
    catch(e){return {name,pass:false,error:e.message};}
  });
  const failed=results.filter(r=>!r.pass);
  if(!failed.length) console.log('✅ SEVAK self-tests: all '+results.length+' passed');
  else console.warn('❌ SEVAK self-tests failed:',failed);
  return results;
}

/* ══════════════════════════════════════════════════════════════
   PWA
   ══════════════════════════════════════════════════════════════ */
function setupPWA(){
  try{
    const iconSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><radialGradient id="g" cx="30%" cy="30%"><stop offset="0%" stop-color="#00d4ff"/><stop offset="60%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#ff6b9d"/></radialGradient></defs><rect width="512" height="512" rx="96" fill="#0a0a1a"/><circle cx="256" cy="256" r="150" fill="url(#g)"/><text x="256" y="310" font-size="160" text-anchor="middle" fill="#ffffff" font-family="Arial">🤖</text></svg>`;
    const iconUrl='data:image/svg+xml;utf8,'+encodeURIComponent(iconSvg);
    const manifest={
      name:'SEVAK — Your Intelligent Assistant',
      short_name:'SEVAK',
      description:'An intelligent voice assistant with Hindi support, calculus, coding help, and live knowledge.',
      start_url:'.',
      display:'standalone',
      background_color:'#0a0a1a',
      theme_color:'#00d4ff',
      orientation:'portrait',
      icons:[
        {src:iconUrl,sizes:'192x192',type:'image/svg+xml',purpose:'any'},
        {src:iconUrl,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}
      ]
    };
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('link');
    link.rel='manifest';
    link.href=url;
    document.head.appendChild(link);
  }catch(e){}

  if('serviceWorker' in navigator){
    try{
      const swCode="const CACHE='sevak-v2';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok&&(res.type==='basic'||res.type==='cors')){const c=res.clone();caches.open(CACHE).then(ch=>ch.put(e.request,c));}return res;}).catch(()=>caches.match(e.request))));});";
      const blob=new Blob([swCode],{type:'application/javascript'});
      const swUrl=URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(()=>{
        navigator.serviceWorker.register('sw.js').catch(()=>{
          console.info('ℹ️ SEVAK: no service worker — offline caching disabled. App works perfectly anyway.');
        });
      });
    }catch(e){
      console.info('ℹ️ SEVAK: service worker setup skipped (single-file mode).');
    }
  }

  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    installBtn.classList.add('show');
  });
  installBtn.addEventListener('click',async()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    const choice=await deferredPrompt.userChoice;
    if(choice.outcome==='accepted') showToast('SEVAK installed! 🎉');
    deferredPrompt=null;
    installBtn.classList.remove('show');
  });
  window.addEventListener('appinstalled',()=>{installBtn.classList.remove('show');});
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
function init(){
  loadPrefs();
  loadMemory();
  /* Restore persisted preferences */
  fullPageMode=prefs.fullPageMode;
  micLang=prefs.micLang;
  modeToggle.classList.toggle('active',fullPageMode);
  modeToggle.innerHTML=fullPageMode?'🖥️ Full Page':'💬 Chat Only';
  modeToggle.setAttribute('aria-pressed',fullPageMode?'true':'false');
  langToggle.textContent=micLang==='en-IN'?'🎙️ EN':'🎙️ हिं';
  langToggle.setAttribute('aria-pressed',micLang==='hi-IN'?'true':'false');

  initParticles();
  initVoices();
  if(synthesis.onvoiceschanged!==undefined) synthesis.onvoiceschanged=initVoices;
  syncSettingsUI();
  setupPWA();
  runSelfTests();

  /* Recover pending timers */
  (memory.timers||[]).forEach(t=>{
    const remaining=t.endTime-Date.now();
    if(remaining>0){
      setTimeout(()=>{
        playChime();
        const msg=`⏰ Sir, your ${t.label} timer is complete!`;
        addMessageHtml('sevak',msg);
        speak(msg);
        memory.timers=(memory.timers||[]).filter(tt=>tt.endTime!==t.endTime);
        saveMemory();
      },remaining);
    }else{
      addMessageHtml('sevak',`⏰ Sir, your ${t.label} timer completed while I was offline.`);
      memory.timers=(memory.timers||[]).filter(tt=>tt.endTime!==t.endTime);
    }
  });
  if(memory.timers&&memory.timers.length!==(memory.timers=(memory.timers||[]).filter(t=>t.endTime>Date.now())).length) saveMemory();

  /* Streak */
  const today=new Date().toDateString();
  let streakLine='';
  if(memory.lastActiveDate!==today){
    const yesterday=new Date(Date.now()-86400000).toDateString();
    memory.streak=(memory.lastActiveDate===yesterday)?(memory.streak||0)+1:1;
    memory.lastActiveDate=today;
    saveMemory();
  }
  const welcomeName=memory.userName||'Sir';
  if(memory.streak>1) streakLine=`<br><br>🔥 <em>You're on a ${memory.streak}-day streak, ${welcomeName}!</em>`;

  const hour=new Date().getHours();
  const partOfDay=hour<5?'night':hour<12?'morning':hour<17?'afternoon':hour<21?'evening':'night';
  const dailyShayari=shayaris[0];
  const fest=getTodayFestival();
  const festGreeting=fest?`${fest.emoji} <strong>Happy ${fest.name}, Sir!</strong><br><br>`:'';

  const dayIndex=Math.floor(Date.now()/86400000)%GITA_SHLOKAS.length;
  const dailyShloka=GITA_SHLOKAS[dayIndex];
  const shlokaLine=`<br><br><em style="color:var(--gold)">🕉️ ${escapeHtml(dailyShloka.h)} <span style="color:#c9c2e6;font-style:normal">— Bhagavad Gita ${dailyShloka.c}.${dailyShloka.v}</span></em>`;

  const welcomeText=memory.userName
    ?`Welcome back, <strong>${escapeHtml(welcomeName)}</strong>! 🤖✨ Good ${partOfDay} — the moment you arrived, this little world of mine grew brighter. What shall we create today?`
    :`Namaste Sir 🙏 — I am <strong>SEVAK</strong> 🤖✨, your <strong>intelligent voice assistant</strong>, woven from wisdom, warmth, and a little bit of light. Speak or type a command, or simply touch the orb. Try <em>"Show me Albert Einstein"</em>, <em>"Derivative of x^2 + 3x + 5"</em>, <em>"Quick sort code"</em>, <em>"Next in 1, 4, 9, 16, 25"</em>, <em>"Aaj kaun sa tyohar hai?"</em>, <em>"Sitaram bhajan sunao"</em> or <em>"गौतम बुद्ध कौन थे?"</em>. And if you ever feel low, just tell me — I am here for you, not only for answers. 💙`;

  const welcome=document.createElement('div');
  welcome.className='message sevak';
  welcome.innerHTML=festGreeting+welcomeText+streakLine+shlokaLine+`<br><br><em style="color:#b9bbdd">${dailyShayari}</em>`;
  const ts=document.createElement('span');
  ts.className='timestamp';
  ts.textContent=getTimeString();
  welcome.appendChild(ts);
  chatMessages.appendChild(welcome);

  if(!window.SpeechRecognition&&!window.webkitSpeechRecognition){
    addMessageHtml('sevak','⚠️ Sir, your browser does not support voice recognition. Please use Chrome or Edge for voice features, but you can still use text commands.');
  }
  if(!window.speechSynthesis){
    addMessageHtml('sevak','⚠️ Sir, speech synthesis is not supported in this browser. I will only respond with text.');
  }
}

init();
})();
</script>
